name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova and ImageMagick
        run: |
          npm install -g cordova
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create Cordova Project & Add Voice Plugin
        run: |
          # অ্যাপের নাম ইংরেজিতে "Bou Bolche" দেওয়া হলো
          cordova create app com.boubolche.app "Bou Bolche"
          cp ${{ github.workspace }}/icon-512.png app/icon.png
          cd app
          sed -i 's|<content src="index.html" />|<content src="https://hamontoshakil.github.io/Bou-Bolche/" />|' config.xml
          sed -i 's|</widget>|    <icon src="icon.png" />\n    <allow-navigation href="*" />\n    <allow-intent href="*" />\n    <access origin="*" />\n</widget>|' config.xml
          cordova platform add android
          # ভয়েস টাইপিং ও মাইক্রোফোন পারমিশনের জন্য নেটিভ প্লাগইন যুক্ত করা হলো
          cordova plugin add cordova-plugin-speechrecognition

      - name: Fix Icons for Both Old MIUI (Redmi) and New Android
        run: |
          cd app/platforms/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          rm -rf mipmap-*-v26
          # Redmi ফোনের সাদা বর্ডার দূর করতে আইকনের চারপাশ হলুদ রঙে ভরাট ও ফুল-ব্লিড করা হচ্ছে
          for dir in mipmap-mdpi:48 mipmap-hdpi:72 mipmap-xhdpi:96 mipmap-xxhdpi:144 mipmap-xxxhdpi:192; do
            folder=$(echo $dir | cut -d: -f1)
            size=$(echo $dir | cut -d: -f2)
            zoom=$(( size * 108 / 100 ))
            mkdir -p $folder
            convert ${{ github.workspace }}/icon-512.png -resize ${zoom}x${zoom} -gravity center -background "#FACC15" -extent ${size}x${size} -flatten $folder/ic_launcher.png
            convert ${{ github.workspace }}/icon-512.png -resize ${zoom}x${zoom} -gravity center -background "#FACC15" -extent ${size}x${size} -flatten $folder/ic_launcher_round.png
            convert ${{ github.workspace }}/icon-512.png -resize ${zoom}x${zoom} -gravity center -background "#FACC15" -extent ${size}x${size} -flatten $folder/ic_launcher_foreground.png
          done

      - name: Build APK
        run: |
          cd app
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BouBolche-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
