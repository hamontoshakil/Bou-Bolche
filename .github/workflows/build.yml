name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Cordova and Icon Generator
        run: npm install -g cordova cordova-res
        
      - name: Create Cordova Project
        run: |
          cordova create app com.boubolche.app "Bou Bolche"
          cp index.html app/www/index.html
          cp icon-512.png app/resources/icon.png || true
          cd app
          cordova platform add android
          cordova-res android --skip-config --copy || true
          
      - name: Build APK
        run: |
          cd app
          cordova build android
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BouBolche-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
