name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Cordova and Tools
        run: npm install -g cordova cordova-res
        
      - name: Create Cordova Project
        run: |
          cordova create app com.boubolche.app "Bou Bolche"
          cd app
          cp ../config.xml config.xml
          cordova platform add android
          
      - name: Generate Icons
        run: |
          cd app
          mkdir -p resources
          cp ../icon-512.png resources/icon.png
          cordova-res android --skip-config --copy || echo "Icon generation skipped"
          
      - name: Build APK
        run: |
          cd app
          cordova build android
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BouBolche-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
