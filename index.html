const playSound = () => {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const c = new C();
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(660, c.currentTime);
    g.gain.setValueAtTime(0.15, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.25);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.25);
  } catch(e) {}
};

  const getSmartPrice = async (itemName) => {
    if (!itemName) return 50;
    const lower = itemName.toLowerCase().trim();
    const dict = data.priceHistory || {};
    for (const [k, v] of Object.entries(dict)) {
      if (lower.includes(k.toLowerCase())) return v;
    }
    const key = data.geminiApiKey || '';
    if (key) {
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `What is the approximate current market price in Bangladesh Taka (BDT) for "${itemName}"? Return ONLY the integer number representing price per unit. No text.` }] }]
          })
        });
        const resJson = await response.json();
        const text = resJson?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const num = parseInt(text.replace(/[^0-9]/g, ''));
        if (!isNaN(num) && num > 0) return num;

    });

      save({ ...data, members: updated });
    }

    const cleanCode = familyCode.trim().toUpperCase();

  const handlePinChange = (index, val) => {
    const digit = val.replace(/[^0-9]/g, '').slice(-1);
    const next = [...pinDigits];
    next[index] = digit;
    setPinDigits(next);
    if (digit && index < 3 && pinRefs[index + 1].current) {

    }
  };

  const handlePinKeyDown = (index, e) => {
    if (e.key === 'Backspace' && !pinDigits[index] && index > 0 && pinRefs[index - 1].current) {

    }

  const handleGoogleSignIn = async () => {
    if (!auth) return toastFn(t('অথেন্টিকেশন উপলব্ধ নয়', 'Auth not available'));
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      const result = await auth.signInWithPopup(provider);
      const user = result.user;
      const email = user.email;
      const displayName = user.displayName || email.split('@')[0];

      setMyPin('1234');

      toastFn(t(`স্বাগতম, ${displayName}!`, `Welcome, ${displayName}!`));

    if (!identClean) return toastFn(t('জিমেইল বা ফ্যামিলি কোড দিন', 'Enter Gmail or Family Code'));

    let codeClean = identClean.toUpperCase().replace(/[^A-Z0-9@.]/g, '');
    if (authMode === 'signup' && !codeClean) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      for (let i = 0; i < 6; i++) codeClean += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    const pinClean = pinDigits.join('');
    if (pinClean.length < 4) {
      return toastFn(t('৪ সংখ্যার গোপন পিন দিন', 'Enter 4-digit security PIN'));
    }

    const derivedName = identClean.includes('@') ? identClean.split('@')[0] : 'Family Member';

    if (db) {
      try {
        const snap = await db.collection('families').doc(codeClean).get();

          const existing = snap.data();
          if (existing.pin && existing.pin !== pinClean) {

    localStorage.setItem('bb_family_code', codeClean);
    localStorage.setItem('bb_my_name', derivedName);
    localStorage.setItem('bb_my_pin', pinClean);
    setMyName(derivedName);
    setMyPin(pinClean);
    setFamilyCode(codeClean);

    const bazarSpentToday = bought.reduce((s, i) => s + (Number(i.price) || 0), 0);
    const remainingEst = unbought.reduce((s, i) => s + (Number(i.price) || Number(i.lastPrice) || 100), 0);

    const todayISO = new Date().toISOString().split('T')[0];
    const paidBills = (data.bills || []).filter(b => b.paid);
    const billsPaidToday = paidBills.filter(b => b.paidDate === todayISO).reduce((s, b) => s + Number(b.amount || 0), 0);
    const spentToday = bazarSpentToday + billsPaidToday;

    const monthHist = (data.history || []).filter(h => h.monthKey === activeMonth.key && !h.isNew);
    const histSpent = monthHist.reduce((s, h) => s + (Number(h.totalSpent) || 0), 0);
    const monthBillsTotal = paidBills
      .filter(b => !b.paidDate || b.paidDate.startsWith(activeMonth.key))
      .reduce((s, b) => s + Number(b.amount || 0), 0);

    const isCurrentMonth = activeMonth.key === '2026-10';
    const monthTotal = histSpent + monthBillsTotal + (isCurrentMonth ? bazarSpentToday : 0);

    const prvKey = prevMonthKey(activeMonth.key);
    const prevHistSpent = (data.history || [])
      .filter(h => h.monthKey === prvKey && !h.isNew)
      .reduce((s, h) => s + (Number(h.totalSpent) || 0), 0);
    const prevBillsSpent = paidBills
      .filter(b => b.paidDate && b.paidDate.startsWith(prvKey))
      .reduce((s, b) => s + Number(b.amount || 0), 0);
    const lastMonthCalc = (prevHistSpent + prevBillsSpent) || Number(data.lastMonthSpent || 0);

    const budget = Number(data.monthlyBudget) || 0;
    const budgetPct = budget > 0 ? Math.round((monthTotal / budget) * 100) : 0;
    const budgetRemaining = Math.max(0, budget - monthTotal);
    const trackedDays = Math.max(1, monthHist.length + (bazarSpentToday > 0 ? 1 : 0));
    const dailyAvg = monthTotal > 0 ? Math.round(monthTotal / trackedDays) : 0;

    const allMonthItems = [
      ...(isCurrentMonth ? bought : []),
      ...monthHist.flatMap(h => (h.items || []).filter(i => i.bought))
    ];
    let bazarCatSum = 0, kidsCatSum = 0, healthCatSum = 0;
    allMonthItems.forEach(it => {
      const amt = Number(it.price) || 0;
      if (it.category === 'baby') kidsCatSum += amt;
      else if (it.category === 'medicine') healthCatSum += amt;
      else bazarCatSum += amt;
    });

    const denom = monthTotal > 0 ? monthTotal : 1;
    const catPcts = {
      bazar: monthTotal > 0 ? Math.round((bazarCatSum / denom) * 100) : 0,
      bills: monthTotal > 0 ? Math.round((monthBillsTotal / denom) * 100) : 0,
      kids: monthTotal > 0 ? Math.round((kidsCatSum / denom) * 100) : 0,
      health: monthTotal > 0 ? Math.round((healthCatSum / denom) * 100) : 0
    };

    return {
      total: items.length,
      boughtCount: bought.length,
      leftCount: unbought.length,
      urgentCount: items.filter(i => i.urgent && !i.bought).length,
      bazarSpentToday,
      remainingEst,
      estTotal,
      spentToday,
      cartProgress: items.length > 0 ? Math.round((bought.length / items.length) * 100) : 0,
      monthTotal,

    if (!key) return toastFn(t('দয়া করে Settings থেকে Gemini API Key দিন', 'Please add Gemini API Key in Settings first'));

    toastFn(t('📸 রসিদ স্ক্যান করা হচ্ছে...', '📸 Scanning receipt...'));
    const reader = new FileReader();
    reader.onload = async () => {
      const base64Data = reader.result.split(',')[1];
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "Analyze this receipt image. Extract all purchased items, quantities, and prices. Return ONLY a valid JSON array of objects with keys: name (string), quantity (string), price (number). No markdown formatting." },
                { inline_data: { mime_type: file.type || "image/jpeg", data: base64Data } }
              ]
            }]
          })
        });
        const resJson = await response.json();
        const rawText = resJson?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleanJsonStr = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(cleanJsonStr);

        if (Array.isArray(parsed) && parsed.length > 0) {
          const newItems = parsed.map((item, idx) => ({
            id: 'ocr_' + (Date.now() + idx),
            name: item.name || 'Item',
            quantity: item.quantity || '1 pc',
            size: '',
            category: 'grocery',
            addedBy: myName || 'OCR Scanner',
            addedAt: nowStr(),
            bought: true, // Receipt items are already bought
            price: Number(item.price) || 0,
            lastPrice: Number(item.price) || 100,
            urgent: false,
            note: '📸 OCR Receipt'
          }));

          save({ ...data, todayItems: u, history: syncHist(u) });
          if (sound) playSound();
          toastFn(`✨ ${newItems.length} items scanned & added!`);
        }
      } catch (err) {
        toastFn(t('⚠️ রসিদ পড়তে সমস্যা হয়েছে', 'Error parsing receipt'));

    };

          {/* TAB 3: EXPENSES */}
          {tab === 'expenses' && (
            <div className="space-y-3.5">
              <div className="flex items-center justify-between px-0.5">
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
                  <span className="font-headline font-bold text-base">Expenses & Budget</span>
                </div>
              </div>
              <div className="bg-white rounded-2xl p-4 shadow-xs border">
                <span className="text-xs text-slate-400 font-bold uppercase">Monthly Budget Tracker</span>
                <div className="font-headline font-extrabold text-2xl mt-1">৳{stats.monthTotal.toLocaleString()} <span className="text-xs text-slate-400 font-normal">/ ৳{stats.budget.toLocaleString()}</span></div>
              </div>
            </div>
          )}

          {/* TAB 4: LOANS */}
          {tab === 'loans' && (
            <div className="space-y-4">
              <div className="flex items-center justify-between">
                <h1 className="font-headline text-2xl font-extrabold tracking-tight">Loan Ledger</h1>
                <button onClick={() => setShowAddLoan(true)} className="px-3.5 py-2 rounded-full bg-primary text-white text-xs font-bold">+ Add Loan</button>
              </div>
              <div className="space-y-3">
                {(data.loans || []).map(loan => (
                  <div key={loan.id} className="bg-white rounded-2xl p-4 border shadow-xs flex items-center justify-between">
                    <div>
                      <h3 className="font-headline font-bold text-sm">{loan.person}</h3>
                      <span className="text-xs text-slate-400">{loan.type} • ৳{loan.amount}</span>
                    </div>
                    <button onClick={() => onToggleLoan(loan)} className="px-3 py-1 bg-primary text-white text-xs font-bold rounded-lg">
                      {loan.settled ? 'Reopen' : 'Settle'}
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 5: SETTINGS */}
          {tab === 'settings' && (
            <div className="space-y-4">
              <div className="bg-white rounded-2xl p-4 shadow-xs border space-y-4">
                <h2 className="font-headline font-bold text-base">Family Sync Pod</h2>
                <div className="p-3 bg-slate-50 rounded-xl">
                  <span className="text-xs text-slate-400 font-bold">Household Code</span>
                  <div className="text-xl font-extrabold text-secondary tracking-wider">{familyCode}</div>
                </div>

                <div className="p-3 bg-indigo-50/60 rounded-xl space-y-2 border border-indigo-200">
                  <span className="font-headline font-bold text-xs flex items-center gap-1">✨ Gemini AI API Key (For Smart Recipes, Estimates & Scan)</span>
                  <div className="flex gap-2">
                    <input
                      type="password"
                      value={tempApiKey}
                      onChange={e => setTempApiKey(e.target.value)}
                      placeholder="AIzaSy..."
                      className="flex-1 bg-white border rounded-xl px-3 py-2 text-xs outline-none"
                    />
                    <button onClick={() => { save({ ...data, geminiApiKey: tempApiKey.trim() }); toastFn('API Key Saved ✔'); }} className="px-4 py-2 bg-primary text-white text-xs font-bold rounded-xl">Save</button>
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-2xl p-4 shadow-xs border">
                <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="w-full py-3 bg-rose-50 text-rose-600 font-bold text-xs rounded-xl border border-rose-200">
                  Disconnect & Log Out
                </button>
              </div>
            </div>
          )}
        </main>

        {/* FLOATING ACTION DOCK FOR BAZAR */}
        {tab === 'bazar' && bazarSubTab === 'today' && (
          <div className="absolute bottom-16 left-0 right-0 z-30 px-4 py-2.5 bg-white/95 border-t backdrop-blur-md shadow-[0_-4px_16px_rgba(0,0,0,0.06)]">
            <div className="flex items-center justify-between gap-2.5">
              <div className="px-3 py-1 rounded-xl bg-slate-100">
                <span className="text-[10px] text-slate-400 font-bold">Cart Total</span>
                <span className="font-headline text-sm font-extrabold text-secondary">৳{stats.bazarSpentToday.toLocaleString()}</span>
              </div>
              <div className="flex items-center gap-2 flex-1 justify-end">
                <button type="button" onClick={() => setShowAdd(true)} className="flex-1 h-10 px-3 rounded-xl bg-primary text-white text-xs font-bold flex items-center justify-center gap-1 shadow-xs">
                  <span className="material-symbols-outlined text-[17px]">add</span>
                  <span>+ Add New Item</span>
                </button>
                <button type="button" onClick={onFinishBazar} className="h-10 px-3 rounded-xl bg-secondary text-white text-xs font-bold flex items-center justify-center gap-1 shrink-0">
                  <span className="material-symbols-outlined text-[17px]">check_circle</span>
                  <span>Finish Bazar</span>
                </button>
              </div>
            </div>
          </div>
        )}

        {/* BOTTOM NAVIGATION BAR */}
        <nav className="flex-none h-16 bg-white/95 backdrop-blur-xl border-t px-2 flex justify-around items-center z-40">
          {[
            { id: 'home', icon: 'home', label: 'Home' },
            { id: 'bazar', icon: 'shopping_basket', label: 'Bazar' },
            { id: 'expenses', icon: 'payments', label: 'Expenses' },
            { id: 'loans', icon: 'handshake', label: 'Loans' },
            { id: 'settings', icon: 'settings', label: 'Settings' }
          ].map(nav => {
            const active = tab === nav.id;
            return (
              <button
                key={nav.id}
                onClick={() => setTab(nav.id)}
                className={`flex flex-col items-center justify-center gap-0.5 py-1 px-3 rounded-xl transition-all ${active ? 'text-primary font-bold' : 'text-slate-400 font-medium'}`}
              >
                <span className={`material-symbols-outlined text-[22px] ${active ? 'icon-fill' : ''}`}>{nav.icon}</span>
                <span className="text-[11px] tracking-tight">{nav.label}</span>
              </button>
            );
          })}
        </nav>

        {/* MODAL: ADD ITEM (Default Quantity is 'None') */}
        {showAdd && (
          <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/60 backdrop-blur-xs" onClick={() => setShowAdd(false)}>
            <div className="w-full max-w-[435px] bg-[#182234] text-slate-100 rounded-t-[28px] sm:rounded-2xl shadow-2xl flex flex-col max-h-[92vh] overflow-hidden" onClick={e => e.stopPropagation()}>
              <div className="flex items-center justify-between px-5 pt-4 pb-3 border-b border-slate-700/40">
                <h2 className="text-base font-headline font-extrabold text-white">Add New Item</h2>
                <button onClick={() => setShowAdd(false)} className="w-8 h-8 rounded-full bg-slate-800 text-slate-400">×</button>
              </div>

              <div className="overflow-y-auto px-5 py-4 space-y-4 text-xs no-scrollbar">
                <form onSubmit={onAddItem} className="space-y-3.5">
                  <div className="space-y-1">
                    <label className="text-slate-300 font-semibold text-xs block">Item Name *</label>
                    <input type="text" required value={iName} onChange={e => setIName(e.target.value)} placeholder="e.g. Apple" className="w-full bg-[#121a29] border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="text-slate-300 font-semibold text-xs block">Quantity (Default None)</label>
                      <input type="text" value={iQty} onChange={e => setIQty(e.target.value)} className="w-full bg-[#121a29] border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white font-semibold outline-none" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-slate-300 font-semibold text-xs block">Price (Optional)</label>
                      <input type="number" value={iPrice} onChange={e => setIPrice(e.target.value)} placeholder="0 (Auto Estimate)" className="w-full bg-[#121a29] border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none" />
                    </div>
                  </div>

                  <div className="space-y-1.5">
                    <span className="text-[11px] font-medium text-slate-400">Quick Select Quantity:</span>
                    <div className="flex items-center gap-1.5 flex-wrap">
                      {QUICK_WEIGHTS.map(w => (
                        <button key={w} type="button" onClick={() => setIQty(w)} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border ${iQty === w ? 'bg-emerald-600/30 border-emerald-500 text-emerald-300' : 'bg-[#222f46] border-slate-700 text-slate-300'}`}>
                          {w}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button type="submit" className="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-500 text-white font-headline font-bold text-sm shadow-lg">
                    + Add to List
                  </button>
                </form>
              </div>
            </div>
          </div>
        )}

        {/* MODAL: AI RECIPE SUGGESTION */}
        {recipeModal && (
          <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
            <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
              <div className="flex items-center justify-between border-b pb-2">
                <h3 className="font-headline font-bold text-base flex items-center gap-1.5">🍳 রান্নার রেসিপি AI</h3>
                <button onClick={() => setRecipeModal(false)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700">×</button>
              </div>
              {recipeLoading ? (
                <div className="py-8 text-center text-xs text-slate-400 animate-pulse">✨ Gemini AI রেসিপি তৈরি করছে...</div>
              ) : (
                <div className="text-xs whitespace-pre-wrap leading-relaxed font-sans">{recipeResult}</div>
              )}
            </div>
          </div>
        )}

        {/* MODAL: AI EXPENSE ADVISOR */}
        {advisorModal && (
          <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
            <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
              <div className="flex items-center justify-between border-b pb-2">
                <h3 className="font-headline font-bold text-base flex items-center gap-1.5">💡 ফিনান্সিয়াল উপদেষ্টা AI</h3>
                <button onClick={() => setAdvisorModal(false)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700">×</button>
              </div>
              {advisorLoading ? (
                <div className="py-8 text-center text-xs text-slate-400 animate-pulse">✨ Gemini AI হিসাব বিশ্লেষণ করছে...</div>
              ) : (
                <div className="text-xs whitespace-pre-wrap leading-relaxed font-sans">{advisorResult}</div>
              )}
            </div>
          </div>
        )}

        {/* MODAL: SMART BUDGET SUGGESTION */}
        {budgetSuggModal && (
          <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
            <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
              <div className="flex items-center justify-between border-b pb-2">
                <h3 className="font-headline font-bold text-base">📈 স্মার্ট বাজেট সাজেশন</h3>
                <button onClick={() => setBudgetSuggModal(false)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700">×</button>
              </div>
              {budgetSuggLoading ? (
                <div className="py-6 text-center text-xs text-slate-400 animate-pulse">✨ বিশ্লেষণ করা হচ্ছে...</div>
              ) : (
                <div className="space-y-3">
                  <p className="text-xs whitespace-pre-wrap leading-relaxed">{budgetSuggResult}</p>
                  <button onClick={() => { save({ ...data, monthlyBudget: 15000 }); setBudgetSuggModal(false); toastFn('বাজেট ৳১৫,০০০ সেট হয়েছে ✔'); }} className="w-full py-2.5 bg-primary text-white font-bold text-xs rounded-xl">
                    Apply Recommended Budget
                  </button>
                </div>
              )}
            </div>
          </div>
        )}

        {/* MODAL: SMART VOICE Q&A */}
        {voiceQueryModal && (
          <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
            <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
              <div className="flex items-center justify-between border-b pb-2">
                <h3 className="font-headline font-bold text-base">🗣️ স্মার্ট ভয়েস অ্যাসিস্ট্যান্ট</h3>
                <button onClick={() => setVoiceQueryModal(false)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700">×</button>
              </div>
              <div className="space-y-3">
                <input
                  type="text"
                  value={voiceQueryText}
                  onChange={e => setVoiceQueryText(e.target.value)}
                  placeholder="যেমন: এই মাসে বাজারে কত খরচ হলো?"
                  className="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl px-3 py-2.5 text-xs outline-none"
                />
                <button onClick={handleVoiceAssistantQuery} className="w-full py-2.5 bg-primary text-white font-bold text-xs rounded-xl">
                  জিজ্ঞেস করুন (Ask AI)
                </button>
                {voiceQueryAnswer && (
                  <div className="p-3 bg-indigo-50 dark:bg-slate-900 rounded-xl text-xs font-semibold leading-relaxed">
                    {voiceQueryAnswer}
                  </div>
                )}
              </div>
            </div>
          </div>
        )}

        {/* MODAL: PRICE CONFIRM (EDITABLE) */}
        {priceItem && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4" onClick={() => setPriceItem(null)}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-[10px] font-extrabold text-secondary uppercase">Edit / Confirm Price</span>
                  <h3 className="font-headline font-extrabold text-base">{priceItem.name}</h3>
                </div>
                <button onClick={() => setPriceItem(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700">×</button>
              </div>
              <form onSubmit={onConfirmPrice} className="space-y-3">
                <div>
                  <label className="text-xs font-bold text-slate-400 block mb-1">Price Paid (৳)</label>
                  <input type="number" autoFocus value={tempPrice} onChange={e => setTempPrice(e.target.value)} placeholder="0" className="w-full bg-slate-50 dark:bg-slate-900 border-2 border-primary rounded-xl px-3.5 py-2.5 text-xl font-headline font-extrabold outline-none" />
                </div>
                <button type="submit" className="w-full bg-primary text-white font-bold py-3 rounded-xl text-sm">✓ Update & Save</button>
              </form>
            </div>
          </div>
        )}

        {/* MODAL: BUDGET */}
        {showBudget && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4" onClick={() => setShowBudget(false)}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <h3 className="font-headline font-extrabold text-base">Set Monthly Budget</h3>
              <form onSubmit={e => { e.preventDefault(); save({ ...data, monthlyBudget: Math.max(0, Number(tempBudget) || 0) }); setShowBudget(false); toastFn('Budget Updated ✔'); }} className="space-y-3">
                <input type="number" autoFocus value={tempBudget} onChange={e => setTempBudget(e.target.value)} placeholder="0" className="w-full bg-slate-50 dark:bg-slate-900 border-2 border-primary rounded-xl px-3.5 py-2.5 text-xl font-headline font-extrabold outline-none" />
                <button type="submit" className="w-full bg-primary text-white font-bold py-3 rounded-xl text-sm">Save</button>
              </form>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
