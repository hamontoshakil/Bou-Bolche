<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bou Bolche - Family Bazar Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
          const [lang, setLang] = React.useState('bn');
          const [darkMode, setDarkMode] = React.useState(false);
          const [activeTab, setActiveTab] = React.useState('today');
          
          const [bazarList, setBazarList] = React.useState([
            { id: 1, name: 'Apple', qty: '1 kg', category: 'Fruits', bought: true, price: 400, addedBy: 'Meem', time: '12:30 PM', urgent: false, size: '', note: 'Fresh ones' },
            { id: 2, name: 'Fish & Meat', qty: '1 kg', category: 'Fish & Meat', bought: false, price: 0, addedBy: 'Shakil', time: '01:15 PM', urgent: true, size: 'L', note: 'Rui fish' },
          ]);

          const [quickAddItems, setQuickAddItems] = React.useState([
            { name: 'ডিম (Eggs)', qty: '1 Dozen', category: 'Grocery', size: 'M' },
            { name: 'দুধ (Milk)', qty: '1 Litre', category: 'Grocery', size: '1L' },
            { name: 'আলু (Potato)', qty: '2 kg', category: 'Vegetables', size: 'M' },
            { name: 'পেঁয়াজ (Onion)', qty: '1 kg', category: 'Vegetables', size: 'M' },
          ]);

          const [showAddModal, setShowAddModal] = React.useState(false);
          const [newItemName, setNewItemName] = React.useState('');
          const [newItemQty, setNewItemQty] = React.useState('1');
          const [newItemCat, setNewItemCat] = React.useState('Grocery');
          const [newItemUrgent, setNewItemUrgent] = React.useState(false);
          const [newItemSize, setNewItemSize] = React.useState('M');
          const [newItemNote, setNewItemNote] = React.useState('');

          const [monthlyBudget, setMonthlyBudget] = React.useState(15000);
          const [soundEnabled, setSoundEnabled] = React.useState(true);

          const [bills, setBills] = React.useState([
            { id: 1, name: 'WiFi Bill', amount: 1200, status: 'Paid', date: '05 Oct 2026' },
            { id: 2, name: 'Electricity Bill', amount: 2100, status: 'Due', date: '15 Oct 2026' },
          ]);

          const [loans, setLoans] = React.useState([
            { id: 1, name: 'Karim Bhai', type: 'given', amount: 1500, note: 'Bazar loan', status: 'Pending' },
            { id: 2, name: 'Rahim', type: 'taken', amount: 2000, note: 'Emergency', status: 'Settled' },
          ]);
          const [showLoanModal, setShowLoanModal] = React.useState(false);
          const [loanName, setLoanName] = React.useState('');
          const [loanAmount, setLoanAmount] = React.useState('');
          const [loanType, setLoanType] = React.useState('given');
          const [loanNote, setLoanNote] = React.useState('');

          const totalSpent = bazarList.filter(item => item.bought).reduce((acc, item) => acc + (Number(item.price) || 0), 0);
          const totalBills = bills.filter(b => b.status === 'Paid').reduce((acc, b) => acc + Number(b.amount), 0);

          const handleAddItem = (name = newItemName, qty = newItemQty, cat = newItemCat, urgent = newItemUrgent, size = newItemSize, note = newItemNote) => {
            if (!name.trim()) return;
            const newItem = {
              id: Date.now(),
              name,
              qty,
              category: cat,
              bought: false,
              price: 0,
              addedBy: 'Shakil',
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              urgent,
              size,
              note
            };
            setBazarList([newItem, ...bazarList]);
            setNewItemName('');
            setNewItemQty('1');
            setNewItemNote('');
            setShowAddModal(false);
            if (soundEnabled) playSound();
          };

          const playSound = () => {
            try {
              const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
              audio.play().catch(e => console.log(e));
            } catch(err) {}
          };

          const toggleBought = (id) => {
            setBazarList(bazarList.map(item => item.id === id ? { ...item, bought: !item.bought } : item));
          };

          const updatePrice = (id, price) => {
            setBazarList(bazarList.map(item => item.id === id ? { ...item, price: Number(price) } : item));
          };

          const deleteItem = (id) => {
            setBazarList(bazarList.filter(item => item.id !== id));
          };

          const addQuickItem = (name, qty, cat, size) => {
            handleAddItem(name, qty, cat, false, size, '');
          };

          const shareOnWhatsApp = () => {
            const text = `🛒 *Bou Bolche - Family Bazar Tracker*\n` + 
              bazarList.map(i => `${i.bought ? '✅' : '⏳'} ${i.name} (${i.qty}) ${i.size ? '['+i.size+']' : ''} ${i.price ? '- ৳'+i.price : ''}`).join('\n') +
              `\n\n💰 মোট খরচ: ৳${totalSpent}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
          };

          return (
            <div className={`min-h-screen ${darkMode ? 'bg-gray-900 text-white' : 'bg-gray-50 text-gray-850'} font-sans pb-24 transition-colors duration-200`}>
              
              {/* Header */}
              <header className={`sticky top-0 z-30 px-4 py-3 shadow-md flex justify-between items-center ${darkMode ? 'bg-gray-800 border-b border-gray-700' : 'bg-white'}`}>
                <div className="flex items-center space-x-2">
                  <span className="text-2xl">🛒</span>
                  <div>
                    <h1 className="font-bold text-sm leading-tight">Bou Bolche</h1>
                    <p className="text-[10px] text-green-500 font-medium">● Family Bazar Tracker</p>
                  </div>
                </div>
                
                <div className="flex items-center space-x-2">
                  <button onClick={() => setSoundEnabled(!soundEnabled)} className={`p-2 rounded-full text-xs ${darkMode ? 'bg-gray-700' : 'bg-gray-100'}`}>
                    {soundEnabled ? '🔔' : '🔕'}
                  </button>
                  <button onClick={() => setLang(lang === 'bn' ? 'en' : 'bn')} className={`px-2.5 py-1 text-xs font-bold rounded-lg border ${darkMode ? 'border-gray-600 bg-gray-700' : 'border-gray-300 bg-gray-50'}`}>
                    {lang === 'bn' ? 'EN' : 'বাং'}
                  </button>
                  <button onClick={() => setDarkMode(!darkMode)} className={`p-2 rounded-full text-xs ${darkMode ? 'bg-gray-700 text-yellow-400' : 'bg-gray-100 text-gray-600'}`}>
                    {darkMode ? '☀️' : '🌙'}
                  </button>
                </div>
              </header>

              <main className="max-w-md mx-auto p-4">
                {activeTab === 'today' && (
                  <div>
                    <div className={`p-4 rounded-2xl shadow-sm mb-4 ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-xs text-gray-400">{lang === 'bn' ? 'চলতি মাসের বাজার খরচ' : 'This Month Bazar'}</span>
                        <button onClick={shareOnWhatsApp} className="bg-green-600 text-white text-[11px] px-2.5 py-1 rounded-lg font-medium shadow">
                          📱 Share
                        </button>
                      </div>
                      <div className="flex justify-between items-baseline mb-2">
                        <h2 className="text-3xl font-extrabold text-green-500">৳{totalSpent}</h2>
                        <span className="text-xs text-gray-400">{lang === 'bn' ? 'বাজেট: ৳' + monthlyBudget : 'Budget: ৳' + monthlyBudget}</span>
                      </div>
                      <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 overflow-hidden">
                        <div className={`h-full rounded-full ${totalSpent > monthlyBudget ? 'bg-red-500' : 'bg-green-500'}`} style={{ width: `${Math.min((totalSpent / monthlyBudget) * 100, 100)}%` }}></div>
                      </div>
                    </div>

                    <div className="flex justify-between items-center mb-3">
                      <h3 className="font-bold text-sm">{lang === 'bn' ? "আজকের বাজার (Today's Bazar)" : "Today's Bazar"}</h3>
                      <span className="text-xs bg-green-100 dark:bg-green-900 text-green-700 dark:text-green-300 px-2 py-0.5 rounded-full font-medium">
                        {bazarList.filter(i => i.bought).length} / {bazarList.length} {lang === 'bn' ? 'কেনা হয়েছে' : 'Bought'}
                      </span>
                    </div>

                    <div className="space-y-3 mb-20">
                      {bazarList.map(item => (
                        <div key={item.id} className={`p-3.5 rounded-xl shadow-sm border transition-all ${item.urgent ? 'border-red-500 bg-red-50 dark:bg-red-950/20' : darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`}>
                          <div className="flex items-start justify-between">
                            <div className="flex items-start space-x-3">
                              <input type="checkbox" checked={item.bought} onChange={() => toggleBought(item.id)} className="mt-1 w-5 h-5 accent-green-600 rounded cursor-pointer" />
                              <div>
                                <div className="flex items-center space-x-2">
                                  <h4 className={`font-semibold text-sm ${item.bought ? 'line-through text-gray-400' : ''}`}>{item.name}</h4>
                                  {item.urgent && <span className="text-[9px] bg-red-600 text-white px-1.5 py-0.5 rounded font-bold">URGENT</span>}
                                  {item.size && <span className="text-[9px] bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 px-1.5 py-0.5 rounded font-bold">Size: {item.size}</span>}
                                </div>
                                <p className="text-xs text-gray-400 mt-0.5">{item.qty} • <span className="text-green-600">{item.category}</span> {item.note ? `• "${item.note}"` : ''}</p>
                              </div>
                            </div>
                            <div className="flex items-center space-x-2">
                              <input type="number" placeholder="দাম ৳" value={item.price || ''} onChange={(e) => updatePrice(item.id, e.target.value)} className={`w-16 text-right px-2 py-1 text-xs rounded-lg border ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50 border-gray-200'}`} />
                              <button onClick={() => deleteItem(item.id)} className="text-gray-400 hover:text-red-500 text-xs">🗑️</button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="fixed bottom-16 left-0 right-0 px-4 max-w-md mx-auto">
                      <button onClick={() => setShowAddModal(true)} className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-2xl shadow-lg flex items-center justify-center space-x-2">
                        <span className="text-lg">+</span>
                        <span className="text-sm">{lang === 'bn' ? 'নতুন আইটেম যোগ করুন' : 'Add New Item'}</span>
                      </button>
                    </div>
                  </div>
                )}

                {activeTab === 'bills' && (
                  <div className="space-y-4 mb-20">
                    <h2 className="font-bold text-base">{lang === 'bn' ? 'বিল ও ইউটিলিটিজ' : 'Bills & Utilities'}</h2>
                    <div className={`p-4 rounded-2xl shadow-sm ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                      <p className="text-xs text-gray-400">Total Paid Bills</p>
                      <h3 className="text-2xl font-bold text-blue-500">৳{totalBills}</h3>
                    </div>
                    <div className="space-y-3">
                      {bills.map(bill => (
                        <div key={bill.id} className={`p-3.5 rounded-xl shadow-sm border flex justify-between items-center ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`}>
                          <div>
                            <h4 className="font-semibold text-sm">{bill.name}</h4>
                            <p className="text-xs text-gray-400">Due: {bill.date}</p>
                          </div>
                          <div className="flex items-center space-x-3">
                            <span className="font-bold text-sm">৳{bill.amount}</span>
                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium ${bill.status === 'Paid' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`}>{bill.status}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'loan' && (
                  <div className="space-y-4 mb-20">
                    <div className="flex justify-between items-center">
                      <h2 className="font-bold text-base">{lang === 'bn' ? 'ধার ও পাওনা খাতা' : 'Loan Ledger'}</h2>
                      <button onClick={() => setShowLoanModal(true)} className="bg-green-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium">+ Add</button>
                    </div>
                    <div className="space-y-3">
                      {loans.map(loan => (
                        <div key={loan.id} className={`p-3.5 rounded-xl shadow-sm border flex justify-between items-center ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`}>
                          <div>
                            <div className="flex items-center space-x-2">
                              <h4 className="font-semibold text-sm">{loan.name}</h4>
                              <span className={`text-[9px] px-1.5 py-0.5 rounded font-bold ${loan.type === 'given' ? 'bg-purple-100 text-purple-700' : 'bg-yellow-100 text-yellow-700'}`}>{loan.type === 'given' ? 'পাওনা' : 'ধার'}</span>
                            </div>
                            <p className="text-xs text-gray-400">{loan.note}</p>
                          </div>
                          <div className="text-right">
                            <p className="font-bold text-sm">৳{loan.amount}</p>
                            <span className="text-[10px] text-gray-400">{loan.status}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'history' && (
                  <div className="space-y-4 mb-20">
                    <h2 className="font-bold text-base">{lang === 'bn' ? 'মাসিক আর্কাইভ' : 'Monthly Archives'}</h2>
                    <div className={`p-4 rounded-xl border ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`}>
                      <div className="flex justify-between items-center">
                        <div>
                          <h4 className="font-bold text-sm">September 2026</h4>
                          <p className="text-xs text-gray-400">Bazar + Bills</p>
                        </div>
                        <span className="font-extrabold text-green-500">৳14,200</span>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'settings' && (
                  <div className="space-y-4 mb-20">
                    <h2 className="font-bold text-base">Settings & Family Sync</h2>
                    <div className={`p-4 rounded-2xl shadow-sm ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                      <h3 className="text-xs font-bold mb-1">Family Code</h3>
                      <div className="flex items-center space-x-2 mt-2">
                        <input type="text" readOnly value="W4ZZXF" className={`px-3 py-2 rounded-lg border font-mono font-bold text-center w-32 text-sm ${darkMode ? 'bg-gray-700 border-gray-600' : 'bg-gray-100 border-gray-200'}`} />
                        <button onClick={() => alert('Code Copied!')} className="bg-green-600 text-white text-xs px-3 py-2 rounded-lg font-medium">Copy</button>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* Bottom Nav */}
              <nav className={`fixed bottom-0 left-0 right-0 border-t flex justify-around py-2.5 z-40 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`}>
                <button onClick={() => setActiveTab('today')} className={`flex flex-col items-center text-[10px] ${activeTab === 'today' ? 'text-green-600 font-bold' : 'text-gray-400'}`}>
                  <span className="text-base">🛒</span><span>{lang === 'bn' ? 'বাজার' : 'Bazar'}</span>
                </button>
                <button onClick={() => setActiveTab('bills')} className={`flex flex-col items-center text-[10px] ${activeTab === 'bills' ? 'text-green-600 font-bold' : 'text-gray-400'}`}>
                  <span className="text-base">🧾</span><span>{lang === 'bn' ? 'বিল' : 'Bills'}</span>
                </button>
                <button onClick={() => setActiveTab('loan')} className={`flex flex-col items-center text-[10px] ${activeTab === 'loan' ? 'text-green-600 font-bold' : 'text-gray-400'}`}>
                  <span className="text-base">🤝</span><span>{lang === 'bn' ? 'ধার' : 'Loan'}</span>
                </button>
                <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center text-[10px] ${activeTab === 'history' ? 'text-green-600 font-bold' : 'text-gray-400'}`}>
                  <span className="text-base">📊</span><span>{lang === 'bn' ? 'হিস্ট্রি' : 'History'}</span>
                </button>
                <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center text-[10px] ${activeTab === 'settings' ? 'text-green-600 font-bold' : 'text-gray-400'}`}>
                  <span className="text-base">⚙️</span><span>{lang === 'bn' ? 'সেটিংস' : 'Settings'}</span>
                </button>
              </nav>

              {/* Add Item Modal */}
              {showAddModal && (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                  <div className={`w-full max-w-sm rounded-2xl p-5 shadow-xl ${darkMode ? 'bg-gray-800 text-white' : 'bg-white text-gray-800'}`}>
                    <h3 className="font-bold text-base mb-3">নতুন বাজার আইটেম</h3>
                    <div className="mb-3">
                      <p className="text-[11px] text-gray-400 mb-1.5">Quick Add:</p>
                      <div className="flex flex-wrap gap-1.5">
                        {quickAddItems.map((q, idx) => (
                          <button key={idx} onClick={() => addQuickItem(q.name, q.qty, q.category, q.size)} className="text-xs bg-green-50 dark:bg-green-900/40 text-green-700 dark:text-green-300 border border-green-200 px-2 py-1 rounded-lg font-medium">+ {q.name}</button>
                        ))}
                      </div>
                    </div>
                    <div className="space-y-3">
                      <input type="text" placeholder="আইটেমের নাম" value={newItemName} onChange={(e) => setNewItemName(e.target.value)} className={`w-full px-3 py-2 rounded-xl border text-xs ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50 border-gray-200'}`} />
                      <div className="grid grid-cols-2 gap-2">
                        <input type="text" placeholder="পরিমাণ (১ কেজি)" value={newItemQty} onChange={(e) => setNewItemQty(e.target.value)} className={`px-3 py-2 rounded-xl border text-xs ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50 border-gray-200'}`} />
                        <select value={newItemSize} onChange={(e) => setNewItemSize(e.target.value)} className={`px-3 py-2 rounded-xl border text-xs ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50 border-gray-200'}`}>
                          <option value="">Size: None</option>
                          <option value="S">Size: S</option>
                          <option value="M">Size: M</option>
                          <option value="L">Size: L</option>
                          <option value="XL">Size: XL</option>
                        </select>
                      </div>
                      <select value={newItemCat} onChange={(e) => setNewItemCat(e.target.value)} className={`w-full px-3 py-2 rounded-xl border text-xs ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50 border-gray-200'}`}>
                        <option value="Grocery">Grocery</option>
                        <option value="Fruits">Fruits</option>
                        <option value="Fish & Meat">Fish & Meat</option>
                        <option value="Vegetables">Vegetables</option>
                        <option value="Baby Care">Baby Care</option>
                        <option value="Shopping">Shopping</option>
                      </select>
                      <input type="text" placeholder="নোট (ব্র্যান্ড বা বিবরণ)" value={newItemNote} onChange={(e) => setNewItemNote(e.target.value)} className={`w-full px-3 py-2 rounded-xl border text-xs ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50 border-gray-200'}`} />
                      <label className="flex items-center space-x-2 text-xs cursor-pointer">
                        <input type="checkbox" checked={newItemUrgent} onChange={(e) => setNewItemUrgent(e.target.checked)} className="w-4 h-4 accent-red-600 rounded" />
                        <span className="text-red-500 font-bold">🚨 Urgent (জরুরি প্রয়োজন)</span>
                      </label>
                    </div>
                    <div className="flex space-x-2 mt-4">
                      <button onClick={() => setShowAddModal(false)} className="w-1/2 py-2 rounded-xl text-xs font-medium border">বাতিল</button>
                      <button onClick={() => handleAddItem()} className="w-1/2 bg-green-600 text-white py-2 rounded-xl text-xs font-medium">যোগ করুন</button>
                    </div>
                  </div>
                </div>
              )}

              {/* Loan Modal */}
              {showLoanModal && (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                  <div className={`w-full max-w-sm rounded-2xl p-5 shadow-xl ${darkMode ? 'bg-gray-800 text-white' : 'bg-white text-gray-800'}`}>
                    <h3 className="font-bold text-base mb-3">নতুন ধার বা পাওনা</h3>
                    <div className="space-y-3">
                      <input type="text" placeholder="নাম" value={loanName} onChange={e=>setLoanName(e.target.value)} className={`w-full px-3 py-2 rounded-xl border text-xs ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50 border-gray-200'}`} />
                      <input type="number" placeholder="টাকার পরিমাণ ৳" value={loanAmount} onChange={e=>setLoanAmount(e.target.value)} className={`w-full px-3 py-2 rounded-xl border text-xs ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50 border-gray-200'}`} />
                      <select value={loanType} onChange={e=>setLoanType(e.target.value)} className={`w-full px-3 py-2 rounded-xl border text-xs ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50 border-gray-200'}`}>
                        <option value="given">পাওনা টাকা (Given)</option>
                        <option value="taken">ধার নেওয়া টাকা (Taken)</option>
                      </select>
                      <input type="text" placeholder="নোট" value={loanNote} onChange={e=>setLoanNote(e.target.value)} className={`w-full px-3 py-2 rounded-xl border text-xs ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50 border-gray-200'}`} />
                    </div>
                    <div className="flex space-x-2 mt-4">
                      <button onClick={()=>setShowLoanModal(false)} className="w-1/2 py-2 rounded-xl text-xs font-medium border">বাতিল</button>
                      <button onClick={()=>{
                        if(!loanName || !loanAmount) return;
                        setLoans([{ id: Date.now(), name: loanName, type: loanType, amount: Number(loanAmount), note: loanNote, status: 'Pending' }, ...loans]);
                        setShowLoanModal(false);
                        setLoanName(''); setLoanAmount(''); setLoanNote('');
                      }} className="w-1/2 bg-green-600 text-white py-2 rounded-xl text-xs font-medium">সেভ</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
