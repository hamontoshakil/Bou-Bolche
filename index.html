const playSound = () => {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const c = new C();
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(660, c.currentTime);
    g.gain.setValueAtTime(0.15, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.25);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.25);
  } catch(e) {}
};

const prevMonthKey = (k) => {
  const [y, m] = k.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
};

  const [selectedHist, setSelectedHist] = useState(null);
  const [monthIdx, setMonthIdx] = useState(5); // Oct 2026
  const [showEditName, setShowEditName] = useState(false);
  const [editNameId, setEditNameId] = useState(null);
  const [tempName, setTempName] = useState('');

  // Add Item Form States
  const [aiPrompt, setAiPrompt] = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  const [iName, setIName] = useState('');
  const [iQty, setIQty] = useState('1 kg');
  const [iSize, setISize] = useState('None');
  const [iCat, setICat] = useState('grocery');
  const [iPrice, setIPrice] = useState('');
  const [iNote, setINote] = useState('');
  const [iUrgent, setIUrgent] = useState(false);
  const [listening, setListening] = useState(false);

  // Add Bill Form States
  const [billType, setBillType] = useState('electricity');
  const [billName, setBillName] = useState('');
  const [billAmount, setBillAmount] = useState('');
  const [billDue, setBillDue] = useState(new Date().toISOString().split('T')[0]);
  const [billNote, setBillNote] = useState('');
  const [billRecurring, setBillRecurring] = useState(true);

  // Loan Ledger States
  const [loanFilter, setLoanFilter] = useState('lent');
  const [loanPerson, setLoanPerson] = useState('');
  const [loanType, setLoanType] = useState('lent');
  const [loanAmount, setLoanAmount] = useState('');
  const [loanDate, setLoanDate] = useState(new Date().toISOString().split('T')[0]);
  const [loanDue, setLoanDue] = useState('');
  const [loanNote, setLoanNote] = useState('');

  // Gemini API Key Input state for Settings
  const [tempApiKey, setTempApiKey] = useState('');

  const t = (bn, en) => lang === 'bn' ? bn : en;
  const toastFn = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3000); };
  const nowStr = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const todayDateDisplay = () => new Date().toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });

  const getPrevPrice = (name) => {
    if (!name) return null;
    const dict = data.priceHistory || {};
    const lower = name.toLowerCase().trim();
    for (const [k, v] of Object.entries(dict)) {
      if (lower.includes(k.toLowerCase())) return v;
    }
    return null;
  };

  const toggleLang = (targetLang) => {
    const next = typeof targetLang === 'string' ? targetLang : (lang === 'bn' ? 'en' : 'bn');
    setLang(next);
    localStorage.setItem('bb_lang', next);
    toastFn(next === 'bn' ? 'বাংলা ভাষা চালু হয়েছে' : 'Switched to English');
  };

  const toggleDark = () => {
    const next = !dark;
    setDark(next);
    localStorage.setItem('bb_dark', String(next));
    toastFn(next ? '🌙 Dark Mode' : '☀️ Light Mode');
  };

  useEffect(() => {
    if (auth) auth.signInAnonymously().catch(() => {});
  }, []);

  // Real-time Firestore Sync
  useEffect(() => {
    if (!db || !familyCode) return;
    const cleanCode = familyCode.trim().toUpperCase();
    const docRef = db.collection('families').doc(cleanCode);

    const unsubscribe = docRef.onSnapshot((docSnap) => {
      setSyncError('');
      setIsSynced(true);
      if (docSnap.exists) {
        const cloudData = docSnap.data();
        setData(prev => ({ ...prev, ...cloudData }));
        if (cloudData.geminiApiKey) setTempApiKey(cloudData.geminiApiKey);
      } else {
        const newDoc = {
          ...INITIAL_DATA,
          familyCode: cleanCode,
          owner: myName || 'Admin',
          pin: myPin || '1234',
          monthlyBudget: 0,
          lastMonthSpent: 0,
          members: [{ id: 'm1', name: myName || 'Admin', role: 'Admin' }],
          updatedAt: Date.now()
        };
        docRef.set(newDoc).catch(err => setSyncError(err.code || 'sync-error'));
      }
    }, (err) => {
      setIsSynced(false);
      setSyncError(err.code || 'offline');
    });

    return () => unsubscribe();
  }, [familyCode]);

  useEffect(() => {
    if (!isSynced || !myName || !familyCode) return;
    const exists = (data.members || []).some(m => m.name.toLowerCase() === myName.toLowerCase());

      const role = (data.members || []).length === 0 ? 'Admin' : 'Partner';
      const updated = [...(data.members || []), { id: 'm' + Date.now(), name: myName, role }];
      save({ ...data, members: updated });
    }
  }, [isSynced, myName]);

  const save = (newData) => {
    setData(newData);
    if (!db || !familyCode) return;
    const cleanCode = familyCode.trim().toUpperCase();
    db.collection('families').doc(cleanCode).set({ ...newData, updatedAt: Date.now() }, { merge: true }).catch(e => {
      setSyncError(e.code || 'save-error');
    });
  };

  const handlePinChange = (index, val) => {
    const digit = val.replace(/[^0-9]/g, '').slice(-1);
    const next = [...pinDigits];
    next[index] = digit;
    setPinDigits(next);
    if (digit && index < 3 && pinRefs[index + 1].current) {
      pinRefs[index + 1].current.focus();
    }
  };

  const handlePinKeyDown = (index, e) => {
    if (e.key === 'Backspace' && !pinDigits[index] && index > 0 && pinRefs[index - 1].current) {
      pinRefs[index - 1].current.focus();
    }
  };

  const handleAuthSubmit = async (e) => {
    e.preventDefault();
    const nameClean = inputName.trim();
    if (!nameClean) return toastFn(t('আপনার নাম লিখুন', 'Please enter your name'));

    let codeClean = inputCode.trim().toUpperCase().replace(/[^A-Z0-9@.]/g, '');
    if (authMode === 'signup' && !codeClean) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      for (let i = 0; i < 6; i++) codeClean += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    if (!codeClean || codeClean.length < 3) {
      return toastFn(t('সঠিক ফ্যামিলি কোড, ফোন বা জিমেইল দিন', 'Enter valid Gmail, Phone or Family Code'));
    }

    const pinClean = pinDigits.join('');
    if (pinClean.length < 4) {
      return toastFn(t('৪ সংখ্যার গোপন পিন দিন', 'Enter 4-digit security PIN'));
    }

    if (db) {
      try {
        const snap = await db.collection('families').doc(codeClean).get();
        if (snap.exists) {
          const existing = snap.data();
          if (existing.pin && existing.pin !== pinClean) {
            return toastFn(t('❌ পিন সঠিক নয়! সঠিক ৪ সংখ্যার পিন দিন।', '❌ Incorrect PIN for this account!'));
          }
        }
      } catch (err) {}
    }

    localStorage.setItem('bb_family_code', codeClean);
    localStorage.setItem('bb_my_name', nameClean);
    localStorage.setItem('bb_my_pin', pinClean);
    setMyName(nameClean);
    setMyPin(pinClean);
    setFamilyCode(codeClean);
    toastFn(t('সফলভাবে কানেক্ট হয়েছে!', 'Connected to Family Space!'));
  };

  // Calculations & Metrics
  const activeMonth = MONTHS[monthIdx] || MONTHS[5];

  const stats = useMemo(() => {
    const items = data.todayItems || [];
    const bought = items.filter(i => i.bought);
    const unbought = items.filter(i => !i.bought);
    const bazarSpentToday = bought.reduce((s, i) => s + (Number(i.price) || 0), 0);
    const remainingEst = unbought.reduce((s, i) => s + (Number(i.price) || Number(i.lastPrice) || getPrevPrice(i.name) || 0), 0);
    const estTotal = bazarSpentToday + remainingEst;

    const todayISO = new Date().toISOString().split('T')[0];
    const paidBills = (data.bills || []).filter(b => b.paid);
    const billsPaidToday = paidBills.filter(b => b.paidDate === todayISO).reduce((s, b) => s + Number(b.amount || 0), 0);
    const spentToday = bazarSpentToday + billsPaidToday;

    const monthHist = (data.history || []).filter(h => h.monthKey === activeMonth.key && !h.isNew);
    const histSpent = monthHist.reduce((s, h) => s + (Number(h.totalSpent) || 0), 0);
    const monthBillsTotal = paidBills
      .filter(b => !b.paidDate || b.paidDate.startsWith(activeMonth.key))
      .reduce((s, b) => s + Number(b.amount || 0), 0);

    const isCurrentMonth = activeMonth.key === '2026-10';
    const monthTotal = histSpent + monthBillsTotal + (isCurrentMonth ? bazarSpentToday : 0);

    const prvKey = prevMonthKey(activeMonth.key);
    const prevHistSpent = (data.history || [])
      .filter(h => h.monthKey === prvKey && !h.isNew)
      .reduce((s, h) => s + (Number(h.totalSpent) || 0), 0);
    const prevBillsSpent = paidBills
      .filter(b => b.paidDate && b.paidDate.startsWith(prvKey))
      .reduce((s, b) => s + Number(b.amount || 0), 0);
    const lastMonthCalc = (prevHistSpent + prevBillsSpent) || Number(data.lastMonthSpent || 0);

    const budget = Number(data.monthlyBudget) || 0;
    const budgetPct = budget > 0 ? Math.round((monthTotal / budget) * 100) : 0;
    const budgetRemaining = Math.max(0, budget - monthTotal);
    const trackedDays = Math.max(1, monthHist.length + (bazarSpentToday > 0 ? 1 : 0));
    const dailyAvg = monthTotal > 0 ? Math.round(monthTotal / trackedDays) : 0;

    const allMonthItems = [
      ...(isCurrentMonth ? bought : []),
      ...monthHist.flatMap(h => (h.items || []).filter(i => i.bought))
    ];
    let bazarCatSum = 0, kidsCatSum = 0, healthCatSum = 0;
    allMonthItems.forEach(it => {
      const amt = Number(it.price) || 0;
      if (it.category === 'baby') kidsCatSum += amt;
      else if (it.category === 'medicine') healthCatSum += amt;
      else bazarCatSum += amt;
    });

    const denom = monthTotal > 0 ? monthTotal : 1;
    const catPcts = {
      bazar: monthTotal > 0 ? Math.round((bazarCatSum / denom) * 100) : 0,
      bills: monthTotal > 0 ? Math.round((monthBillsTotal / denom) * 100) : 0,
      kids: monthTotal > 0 ? Math.round((kidsCatSum / denom) * 100) : 0,
      health: monthTotal > 0 ? Math.round((healthCatSum / denom) * 100) : 0
    };

    return {
      total: items.length,
      boughtCount: bought.length,
      leftCount: unbought.length,
      urgentCount: items.filter(i => i.urgent && !i.bought).length,
      bazarSpentToday,
      remainingEst,
      estTotal,
      spentToday,
      cartProgress: items.length > 0 ? Math.round((bought.length / items.length) * 100) : 0,
      monthTotal,
      lastMonthCalc,
      budget,
      budgetPct,
      budgetRemaining,
      dailyAvg,
      catPcts,
      allMonthItems
    };
  }, [data, activeMonth]);

  const loansStats = useMemo(() => {
    const all = data.loans || [];

  const syncHist = (items) => {

  };

  // Real Gemini AI Integration via Settings API Key
  const handleAiExtract = async () => {
    const promptText = aiPrompt.trim();
    if (!promptText) return toastFn(t('কিছু লিখুন বা বলুন', 'Type items or memo details'));

    const key = data.geminiApiKey || '';
    if (!key) {
      // Fallback Smart Rule-based parser if no API key is set
      const parts = promptText.split(/[,।\n]+|\s+এবং\s+|\s+ও\s+|\s+and\s+/i).map(s => s.trim()).filter(Boolean);
      const newItems = parts.map((part, idx) => {
        const qtyMatch = part.match(/(\d+(?:\.\d+)?\s*(?:কেজি|গ্রাম|পিস|প্যাকেট|লিটার|ডজন|kg|g|gm|pc|pcs|pack|ltr|l|dozen))/i);
        const qty = qtyMatch ? qtyMatch[1] : '1 pc';
        const cleanName = qtyMatch ? (part.replace(qtyMatch[0], '').trim() || part) : part;
        const prev = getPrevPrice(cleanName) || 0;
        return {
          id: 'ai_' + (Date.now() + idx),
          name: cleanName,
          quantity: qty,
          size: '',
          category: 'grocery',
          addedBy: myName || 'AI',
          addedAt: nowStr(),
          bought: false,
          price: 0,
          lastPrice: prev,
          urgent: false,
          note: '✨ Smart Add'
        };
      });
      const u = [...newItems, ...(data.todayItems || [])];
      save({ ...data, todayItems: u, history: syncHist(u) });
      if (sound) playSound();
      setAiPrompt('');
      setShowAdd(false);
      toastFn(`✨ ${newItems.length} ${t('টি আইটেম যোগ হয়েছে (Offline AI)!', 'items added via smart parse!')}`);
      return;
    }

    setAiLoading(true);
    toastFn(t('✨ Gemini AI প্রসেস করছে...', '✨ Gemini AI is analyzing...'));

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: `Extract grocery items from this text: "${promptText}". Return ONLY a valid JSON array of objects with keys: "name" (string, item name in Bengali or English), "quantity" (string like 1 kg, 2 pcs), "category" (one of: grocery, vegetables, fish_meat, fruits, baby, medicine, shopping, other). No markdown formatting.`
            }]
          }]
        })
      });
      const resJson = await response.json();
      const rawText = resJson?.candidates?.[0]?.content?.parts?.[0]?.text || '';
      const cleanJsonStr = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      const parsed = JSON.parse(cleanJsonStr);

      if (Array.isArray(parsed) && parsed.length > 0) {
        const newItems = parsed.map((item, idx) => ({
          id: 'gemini_' + (Date.now() + idx),
          name: item.name || 'Bazar Item',
          quantity: item.quantity || '1 kg',
          size: '',
          category: item.category || 'grocery',
          addedBy: myName || 'Gemini AI',
          addedAt: nowStr(),
          bought: false,
          price: 0,
          lastPrice: getPrevPrice(item.name) || 0,
          urgent: false,
          note: '✨ Gemini AI Parsed'
        }));
        const u = [...newItems, ...(data.todayItems || [])];
        save({ ...data, todayItems: u, history: syncHist(u) });
        if (sound) playSound();
        setAiPrompt('');
        setShowAdd(false);
        toastFn(`✨ Gemini AI: ${newItems.length} ${t('টি আইটেম সফলভাবে যোগ করেছে!', 'items parsed & added!')}`);
      } else {
        throw new Error('Invalid format');
      }
    } catch (err) {
      toastFn(t('⚠️ Gemini API কী চেক করুন বা সাধারণ টাইপ করুন', '⚠️ Check API key or use normal add'));
    } finally {
      setAiLoading(false);
    }
  };

    if (window.plugins && window.plugins.speechRecognition) {

        const startNative = () => {
          setListening(true);
          toastFn(t('🎤 কথা বলুন...', '🎤 Speak now...'));
          window.plugins.speechRecognition.startListening(
            (matches) => {
              setListening(false);
              if (matches && matches.length > 0) applyVoiceText(matches[0].trim(), isAiField);
            },
            () => { setListening(false); toastFn(t('আবার চেষ্টা করুন', 'Try again')); },
            { language: voiceLang, matches: 1, showPopup: true }

        };
        if (!hasPerm) {
          window.plugins.speechRecognition.requestPermission(() => startNative(), () => toastFn(t('মাইক্রোফোন পারমিশন প্রয়োজন!', 'Mic permission required!')));
        } else startNative();
      }, () => {});
      return;
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return toastFn(t('কীবোর্ডের মাইক্রোফোন ব্যবহার করুন', 'Use keyboard mic'));

      const r = new SR();
      r.lang = voiceLang;
      r.interimResults = false;
      setListening(true);
      toastFn(t('🎤 বলুন...', '🎤 Listening...'));
      r.onresult = (e) => { applyVoiceText(e.results[0][0].transcript.trim(), isAiField); setListening(false); };
      r.onerror = () => { setListening(false); toastFn(t('পারমিশন দিন', 'Allow mic')); };

              <div className="flex items-center justify-between">
                <h3 className="font-headline font-extrabold text-base">Add Loan / Debt</h3>
                <button onClick={() => setShowAddLoan(false)} className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center">×</button>
              </div>
              <form onSubmit={onAddLoan} className="space-y-3">
                <div className="grid grid-cols-2 gap-2">
                  <button type="button" onClick={() => setLoanType('lent')} className={`p-3 rounded-xl border text-xs font-bold ${loanType === 'lent' ? 'bg-indigo-950 border-indigo-500 text-indigo-300' : 'bg-slate-800 text-slate-400'}`}>💚 Lent</button>
                  <button type="button" onClick={() => setLoanType('borrowed')} className={`p-3 rounded-xl border text-xs font-bold ${loanType === 'borrowed' ? 'bg-emerald-950 border-emerald-500 text-emerald-300' : 'bg-slate-800 text-slate-400'}`}>💔 Borrowed</button>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-300 block mb-1">Person Name *</label>
                  <input type="text" required value={loanPerson} onChange={e => setLoanPerson(e.target.value)} placeholder="Karim Ahmed" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none" />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-300 block mb-1">Amount (৳) *</label>
                  <input type="number" required value={loanAmount} onChange={e => setLoanAmount(e.target.value)} placeholder="5000" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-bold text-white outline-none" />
                </div>
                <button type="submit" className="w-full py-3 rounded-xl bg-primary text-white font-bold text-sm">+ Save Loan</button>
              </form>
            </div>
          </div>
        )}

        {/* ======================== MODAL: PRICE CONFIRM ======================== */}
        {priceItem && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4" onClick={() => setPriceItem(null)}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-[10px] font-extrabold text-secondary uppercase">Bought!</span>
                  <h3 className="font-headline font-extrabold text-base">{priceItem.name}</h3>
                </div>
                <button onClick={() => setPriceItem(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700">×</button>
              </div>
              <form onSubmit={onConfirmPrice} className="space-y-3">
                <div>
                  <label className="text-xs font-bold text-slate-400 block mb-1">Price Paid (৳)</label>
                  <input type="number" autoFocus value={tempPrice} onChange={e => setTempPrice(e.target.value)} placeholder="0" className="w-full bg-slate-50 dark:bg-slate-900 border-2 border-primary rounded-xl px-3.5 py-2.5 text-xl font-headline font-extrabold outline-none" />
                </div>
                <button type="submit" className="w-full bg-primary text-white font-bold py-3 rounded-xl text-sm">✓ Confirm</button>
              </form>
            </div>
          </div>
        )}

        {/* ======================== MODAL: BUDGET ======================== */}
        {showBudget && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4" onClick={() => setShowBudget(false)}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <h3 className="font-headline font-extrabold text-base">Set Monthly Budget</h3>
              <form onSubmit={e => { e.preventDefault(); save({ ...data, monthlyBudget: Math.max(0, Number(tempBudget) || 0) }); setShowBudget(false); toastFn('Budget Updated ✔'); }} className="space-y-3">
                <input type="number" autoFocus value={tempBudget} onChange={e => setTempBudget(e.target.value)} placeholder="0" className="w-full bg-slate-50 dark:bg-slate-900 border-2 border-primary rounded-xl px-3.5 py-2.5 text-xl font-headline font-extrabold outline-none" />
                <button type="submit" className="w-full bg-primary text-white font-bold py-3 rounded-xl text-sm">Save</button>
              </form>
            </div>
          </div>
        )}

        {/* ======================== MODAL: EDIT MEMBER NAME ======================== */}
        {showEditName && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4" onClick={() => setShowEditName(false)}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <h3 className="font-headline font-extrabold text-base">✏️ Edit Member Name</h3>
              <form onSubmit={e => { e.preventDefault(); const u = (data.members || []).map(m => m.id === editNameId ? { ...m, name: tempName.trim() } : m); save({ ...data, members: u }); setShowEditName(false); toastFn('Updated ✔'); }} className="space-y-3">
                <input type="text" autoFocus value={tempName} onChange={e => setTempName(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl px-3.5 py-2.5 text-sm font-bold outline-none" />
                <button type="submit" className="w-full bg-primary text-white font-bold py-2.5 rounded-xl text-xs">Save</button>
              </form>
            </div>
          </div>
        )}

        {/* ======================== MODAL: SHARE ======================== */}
        {showShare && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={() => setShowShare(false)}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-[435px] rounded-t-3xl sm:rounded-3xl p-5 space-y-3 shadow-2xl" onClick={e => e.stopPropagation()}>
              <div className="flex items-center justify-between">
                <h3 className="font-headline font-extrabold text-base">Share Bazar List</h3>
                <button onClick={() => setShowShare(false)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700">×</button>
              </div>
              <div className="bg-slate-50 dark:bg-slate-900 rounded-xl p-3 border max-h-44 overflow-y-auto">
                <pre className="text-[11px] whitespace-pre-wrap font-sans">{genShareText()}</pre>
              </div>
              <div className="grid grid-cols-2 gap-2.5">
                <button onClick={() => { window.open(`https://wa.me/?text=${encodeURIComponent(genShareText())}`, '_blank'); setShowShare(false); }} className="bg-[#25D366] text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-1.5">
                  <span>💬 WhatsApp</span>
                </button>
                <button onClick={() => { navigator.clipboard?.writeText(genShareText()); setShowShare(false); toastFn('Copied!'); }} className="bg-primary text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-1.5">
                  <span>📋 Copy Text</span>
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ======================== MODAL: HISTORY DETAILS ======================== */}
        {selectedHist && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4" onClick={() => setSelectedHist(null)}>
            <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <div className="flex items-center justify-between border-b pb-3">
                <div>
                  <h3 className="font-headline font-bold text-sm">{selectedHist.dateStr}</h3>
                  <p className="text-xs text-slate-400">Total: ৳{Number(selectedHist.totalSpent || 0).toLocaleString()}</p>
                </div>
                <button onClick={() => setSelectedHist(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700">×</button>
              </div>
              <div className="space-y-2 max-h-64 overflow-y-auto no-scrollbar">
                {(selectedHist.items || []).map((it, idx) => (
                  <div key={idx} className="flex items-center justify-between text-xs py-1.5 border-b border-slate-50">
                    <span className="font-medium">{it.bought ? '✅' : '⬜'} {it.name} ({it.quantity})</span>
                    <span className="font-bold">৳{Number(it.price || 0).toLocaleString()}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
