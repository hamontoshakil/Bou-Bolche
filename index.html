// Dynamic Months Logic
const getDynamicMonths = () => {
  const months = [];
  const d = new Date();
  for (let i = 11; i >= 0; i--) {
    const past = new Date(d.getFullYear(), d.getMonth() - i, 1);
    const key = `${past.getFullYear()}-${String(past.getMonth() + 1).padStart(2, '0')}`;
    months.push({
      key,
      label: past.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
      bn: past.toLocaleDateString('bn-BD', { month: 'long', year: 'numeric' })
    });
  }
  return months;
};

const playSound = () => {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const c = new C();
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(660, c.currentTime);
    g.gain.setValueAtTime(0.15, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.25);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.25);
  } catch(e) {}
};

          const newItems = parsed.map((item, idx) => ({ id: 'ocr_' + Date.now() + idx, name: item.name, quantity: 'None', size: '', category: 'grocery', addedBy: myName, addedAt: nowStr(), bought: true, price: Number(item.price) || 0, lastPrice: Number(item.price) || 0, urgent: false, note: '📸 Receipt OCR' }));
          const u = [...newItems, ...(data.todayItems || [])];
          save({ ...data, todayItems: u });
          if (sound) playSound();
          setShowAdd(false);
          toastFn(`✅ ${parsed.length} items added from receipt!`);
        }
      } catch (err) { toastFn('❌ OCR Failed.'); }
      setOcrLoading(false);
    };
    reader.readAsDataURL(file);
  };

  const handleAiExtract = async () => {
    if (!aiPrompt.trim()) return;
    if (!data.geminiApiKey) return toastFn(t('সেটিংসে API Key দিন', 'Add API Key'));
    setAiLoading(true);
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${data.geminiApiKey}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: `Extract items from: "${aiPrompt}". Return JSON: [{'name': 'name', 'quantity': '1 kg'}]. No markdown.` }] }] })
      });
      const json = await res.json();
      const text = json.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
      const parsed = JSON.parse(text);
      if (Array.isArray(parsed)) {
        const newItems = parsed.map((item, idx) => ({ id: 'ai_' + Date.now() + idx, name: item.name, quantity: item.quantity || 'None', size: '', category: 'grocery', addedBy: myName, addedAt: nowStr(), bought: false, price: 0, lastPrice: getPrevPrice(item.name), urgent: false, note: '✨ AI Add' }));
        const u = [...newItems, ...(data.todayItems || [])];
        save({ ...data, todayItems: u });
        if (sound) playSound();
        setAiPrompt(''); setShowAdd(false);
        toastFn(`✨ ${newItems.length} items added!`);
      }
    } catch (e) { toastFn('AI Parsing Failed'); }
    setAiLoading(false);
  };

  const applyVoiceText = (txt, isAiField = false) => {
    if (!txt) return;
    if (isAiField) { setAiPrompt(prev => prev ? `${prev}, ${txt}` : txt); return; }
    const m = txt.match(/(\d+(?:\.\d+)?\s*(?:কেজি|গ্রাম|পিস|প্যাকেট|লিটার|ডজন|kg|gm|pc|pcs|pack|ltr))/i);
    if (m) { setIQty(m[1]); setIName(txt.replace(m[1], '').trim() || txt); } else { setIName(txt); }
  };

  const onVoice = (isAiField = false) => {
    const voiceLang = lang === 'bn' ? 'bn-BD' : 'en-US';
    if (window.plugins && window.plugins.speechRecognition) {
      window.plugins.speechRecognition.hasPermission((hasPerm) => {
        const startNative = () => {
          setListening(true);
          window.plugins.speechRecognition.startListening(
            (matches) => { setListening(false); if (matches && matches.length > 0) applyVoiceText(matches[0].trim(), isAiField); },
            () => { setListening(false); toastFn('Try again'); },
            { language: voiceLang, matches: 1, showPopup: true }
          );
        };
        if (!hasPerm) window.plugins.speechRecognition.requestPermission(startNative, () => toastFn('Mic required!'));
        else startNative();
      }, () => {});
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return toastFn('Mic not supported');
    try {
      const r = new SR(); r.lang = voiceLang; r.interimResults = false;
      setListening(true);
      r.onresult = (e) => { applyVoiceText(e.results[0][0].transcript.trim(), isAiField); setListening(false); };
      r.onerror = () => { setListening(false); toastFn('Allow mic'); };
      r.onend = () => setListening(false);
      r.start();
    } catch (e) { setListening(false); }
  };

  // Item Actions
  const onAddItem = (e) => {
    e.preventDefault();
    if (!iName.trim()) return;
    const prev = getPrevPrice(iName);
    const newItem = { id: 'i' + Date.now(), name: iName.trim(), quantity: iQty === 'None' ? '' : iQty, size: iSize === 'None' ? '' : iSize, category: iCat, addedBy: myName, addedAt: nowStr(), bought: false, price: Number(iPrice) || 0, lastPrice: prev || Number(iPrice) || 0, urgent: iUrgent, note: iNote.trim() };
    const u = [newItem, ...(data.todayItems || [])];
    save({ ...data, todayItems: u, notification: { active: true, sender: myName, dateStr: todayDateDisplay(), itemCount: u.length } });
    if (sound) playSound();
    setIName(''); setIQty('None'); setISize('None'); setIPrice(''); setINote(''); setIUrgent(false); setShowAdd(false);
    toastFn(`"${newItem.name}" ${t('যোগ হয়েছে', 'added')}`);
  };

  const onToggleItem = (item) => {
    if (!item.bought) {
      setPriceItem(item);
      setTempPrice(item.price > 0 ? String(item.price) : item.lastPrice ? String(item.lastPrice) : getPrevPrice(item.name) ? String(getPrevPrice(item.name)) : '');
    } else {
      const u = (data.todayItems || []).map(i => i.id === item.id ? { ...i, bought: false } : i);
      save({ ...data, todayItems: u });
    }
  };

  const onConfirmPrice = (e) => {
    e.preventDefault();
    if (!priceItem) return;
    const p = Math.max(0, Number(tempPrice) || 0);
    const uPH = { ...(data.priceHistory || {}), [priceItem.name.toLowerCase()]: p };
    const uItems = (data.todayItems || []).map(i => i.id === priceItem.id ? { ...i, bought: true, price: p, lastPrice: p } : i);
    save({ ...data, priceHistory: uPH, todayItems: uItems });
    if (sound) playSound();
    setPriceItem(null); setTempPrice('');
  };

  const onFinishBazar = async () => {
    const bought = (data.todayItems || []).filter(i => i.bought);
    if (bought.length === 0) return toastFn(t('অন্তত ১টি আইটেম কিনুন!', 'Check at least 1 item!'));
    const total = bought.reduce((s, i) => s + (Number(i.price) || 0), 0);
    const sess = { dateStr: `${todayDateDisplay()} (${nowStr()})`, monthKey: currentMonthKey, boughtCount: bought.length, totalCount: data.todayItems.length, totalSpent: total, sender: myName, tag: 'Completed', items: [...data.todayItems], timestamp: Date.now() };

    if (isGuest) {
      const localHist = JSON.parse(localStorage.getItem('bb_guest_history') || '[]');
      localHist.unshift({ id: 'h'+Date.now(), ...sess });
      localStorage.setItem('bb_guest_history', JSON.stringify(localHist));
      setHistoryData(localHist);
    } else if (db) {
      await db.collection('families').doc(familyCode).collection('history').add(sess);
    }

    const rem = (data.todayItems || []).filter(i => !i.bought);
    save({ ...data, todayItems: rem });
    if (sound) playSound();
    toastFn(t('🎉 বাজার হিস্ট্রিতে সেভ হয়েছে!', '🎉 Bazar archived!'));
    setBazarSubTab('history');
  };

  const handleEditHistSubmit = async (e) => {
    e.preventDefault();
    if (!editHistItem || !selectedHist) return;
    const newP = Number(editHistPrice) || 0;
    const updatedItems = selectedHist.items.map(it => it.id === editHistItem.id ? { ...it, price: newP } : it);
    const newTotal = updatedItems.filter(i => i.bought).reduce((s, i) => s + (Number(i.price) || 0), 0);
    const updatedSess = { ...selectedHist, items: updatedItems, totalSpent: newTotal };

    if (isGuest) {
      const localHist = JSON.parse(localStorage.getItem('bb_guest_history') || '[]');
      const idx = localHist.findIndex(h => h.id === selectedHist.id);
      if(idx > -1) localHist[idx] = updatedSess;
      localStorage.setItem('bb_guest_history', JSON.stringify(localHist));
      setHistoryData(localHist);
    } else if (db) {
      await db.collection('families').doc(familyCode).collection('history').doc(selectedHist.id).update({ items: updatedItems, totalSpent: newTotal });
    }
    setSelectedHist(updatedSess); setEditHistItem(null); toastFn('Price Updated ✔');
  };

  // Bills & Loans
  const onAddBill = (e) => {
    e.preventDefault();
    if (!billName.trim() || !billAmount) return;
    const newBill = { id: 'b' + Date.now(), name: billName.trim(), type: billType, amount: Number(billAmount) || 0, dueDate: billDue || '', paid: false, paidDate: null, note: billNote.trim(), recurring: billRecurring };
    save({ ...data, bills: [newBill, ...(data.bills || [])] });
    if (sound) playSound();
    setBillName(''); setBillAmount(''); setBillNote(''); setShowAddBill(false); toastFn('Bill Added ✔');
  };

  const onToggleBill = (bill) => {
    const nextPaid = !bill.paid;
    const paidDate = nextPaid ? new Date().toISOString().split('T')[0] : null;
    const u = (data.bills || []).map(b => b.id === bill.id ? { ...b, paid: nextPaid, paidDate } : b);
    save({ ...data, bills: u });
    if (sound && nextPaid) playSound();
  };

  const onAddLoan = (e) => {
    e.preventDefault();
    if (!loanPerson.trim() || !loanAmount) return;
    const newLoan = { id: 'l' + Date.now(), person: loanPerson.trim(), type: loanType, amount: Number(loanAmount) || 0, date: loanDate, dueDate: loanDue, note: loanNote, settled: false };
    save({ ...data, loans: [newLoan, ...(data.loans || [])] });
    if (sound) playSound();
    setLoanPerson(''); setLoanAmount(''); setLoanDue(''); setLoanNote(''); setShowAddLoan(false); toastFn('Loan Added ✔');
  };

  const onToggleLoan = (loan) => {
    const u = (data.loans || []).map(l => l.id === loan.id ? { ...l, settled: !l.settled } : l);
    save({ ...data, loans: u });
    if (sound) playSound();
  };

  const exportCSV = () => {
    let csv = "Type,Name,Category,Amount,Status\n";
    (data.todayItems || []).forEach(i => { csv += `Bazar,"${i.name}","${i.category}",${i.price || 0},${i.bought ? 'Bought' : 'Pending'}\n`; });
    (data.bills || []).forEach(b => { csv += `Bill,"${b.name}","${b.type}",${b.amount || 0},${b.paid ? 'Paid' : 'Due'}\n`; });
    (data.loans || []).forEach(l => { csv += `Loan(${l.type}),"${l.person}","${l.date}",${l.amount || 0},${l.settled ? 'Settled' : 'Active'}\n`; });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Bou_Bolche_Data.csv`; a.click();
    toastFn('Downloaded!');
  };

  const genShareText = () => {
    let s = `🛒 *Bou Bolche - Bazar List*\n📅 ${todayDateDisplay()}\n━━━━━━━━━━━━━━\n`;
    (data.todayItems || []).forEach((it, idx) => { s += `${it.bought ? '✅' : '⬜'} ${idx + 1}. ${it.name} ${it.quantity ? `(${it.quantity})` : ''}\n`; });
    return s;
  };

  // Metrics
  const stats = useMemo(() => {
    const items = data.todayItems || [];
    const bought = items.filter(i => i.bought);
    const unbought = items.filter(i => !i.bought);
    const bazarSpentToday = bought.reduce((s, i) => s + (Number(i.price) || 0), 0);
    const remainingEst = unbought.reduce((s, i) => s + getPrevPrice(i.name), 0);
    const estTotal = bazarSpentToday + remainingEst;
    
    const todayISO = new Date().toISOString().split('T')[0];
    const paidBills = (data.bills || []).filter(b => b.paid);
    const billsPaidToday = paidBills.filter(b => b.paidDate === todayISO).reduce((s, b) => s + Number(b.amount || 0), 0);
    const spentToday = bazarSpentToday + billsPaidToday;

    const monthHist = historyData.filter(h => h.monthKey === activeMonth.key);
    const histSpent = monthHist.reduce((s, h) => s + (Number(h.totalSpent) || 0), 0);
    const monthBillsTotal = paidBills.filter(b => !b.paidDate || b.paidDate.startsWith(activeMonth.key)).reduce((s, b) => s + Number(b.amount || 0), 0);

    const isCurrentMonth = activeMonth.key === currentMonthKey;
    const monthTotal = histSpent + monthBillsTotal + (isCurrentMonth ? bazarSpentToday : 0);

    const budget = Number(data.monthlyBudget) || 0;
    const budgetPct = budget > 0 ? Math.round((monthTotal / budget) * 100) : 0;
    const budgetRemaining = Math.max(0, budget - monthTotal);
    const trackedDays = Math.max(1, monthHist.length + (bazarSpentToday > 0 ? 1 : 0));
    const dailyAvg = monthTotal > 0 ? Math.round(monthTotal / trackedDays) : 0;

    return { total: items.length, boughtCount: bought.length, leftCount: unbought.length, urgentCount: items.filter(i => i.urgent && !i.bought).length, bazarSpentToday, remainingEst, estTotal, spentToday, cartProgress: items.length > 0 ? Math.round((bought.length / items.length) * 100) : 0, monthTotal, budget, budgetPct, budgetRemaining, dailyAvg };
  }, [data, activeMonth, historyData, currentMonthKey]);

  const loansStats = useMemo(() => {
    const all = data.loans || [];
    const activeLent = all.filter(x => x.type === 'lent' && !x.settled);
    const activeBorrowed = all.filter(x => x.type === 'borrowed' && !x.settled);
    return { lentTotal: activeLent.reduce((s, x) => s + Number(x.amount || 0), 0), borrowedTotal: activeBorrowed.reduce((s, x) => s + Number(x.amount || 0), 0), lentCount: activeLent.length, borrowedCount: activeBorrowed.length, allLentCount: all.filter(x => x.type === 'lent').length, allBorrowedCount: all.filter(x => x.type === 'borrowed').length };
  }, [data.loans]);

  // ======================== LOGIN SCREEN ========================
  if (!familyCode) {
    return (
      <div className={`${dark ? 'dark bg-slate-950 text-white' : 'bg-slate-100 text-slate-900'} h-screen w-full flex flex-col items-center justify-center p-4`}>
        <div className="w-full max-w-[400px] bg-white dark:bg-slate-900 rounded-3xl shadow-xl overflow-hidden border border-slate-200 dark:border-slate-800">
          
          <div className="bg-primary/5 p-6 flex flex-col items-center border-b border-slate-100 dark:border-slate-800">
            <div className="w-20 h-20 rounded-2xl bg-white shadow-sm flex items-center justify-center mb-3 overflow-hidden border border-slate-100">
               <img src="icon-192.png" alt="Logo" className="w-full h-full object-cover" onError={(e)=>e.target.style.display='none'} />
               <span className="text-4xl absolute -z-10">🧺</span>
            </div>
            <h1 className="text-2xl font-headline font-extrabold flex items-center gap-1">Bou Bolche <span className="text-primary text-sm font-bold">(বউ বলছে)</span></h1>
            <p className="text-[11px] text-slate-500 mt-1 text-center">Family Daily Bazar, Budget & Shared Expense Ledger</p>
          </div>

          <div className="p-5 space-y-4">
            <div className="grid grid-cols-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
              <button onClick={() => setAuthMode('signin')} className={`py-2 rounded-lg text-xs font-bold transition-all ${authMode === 'signin' ? 'bg-white dark:bg-slate-900 text-primary shadow-sm' : 'text-slate-500'}`}>Sign In</button>
              <button onClick={() => setAuthMode('signup')} className={`py-2 rounded-lg text-xs font-bold transition-all ${authMode === 'signup' ? 'bg-white dark:bg-slate-900 text-primary shadow-sm' : 'text-slate-500'}`}>New Family Setup</button>
            </div>

            <form onSubmit={handleAuthSubmit} className="space-y-3.5">
              {authMode === 'signup' && (
                <div className="space-y-1">
                  <label className="text-xs font-semibold">Your Name *</label>
                  <div className="relative"><span className="absolute left-3 top-2.5 material-symbols-outlined text-slate-400 text-[18px]">person</span><input type="text" value={inputName} onChange={e => setInputName(e.target.value)} placeholder="e.g. Tanvir" className="w-full h-10 pl-9 pr-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 text-sm outline-none focus:border-primary" /></div>
                </div>
              )}
              <div className="space-y-1">
                <div className="flex justify-between items-center"><label className="text-xs font-semibold">Gmail or Family Code</label><span className="text-[10px] text-slate-400">e.g. 64T95L</span></div>
                <div className="relative"><span className="absolute left-3 top-2.5 material-symbols-outlined text-slate-400 text-[18px]">alternate_email</span><input type="text" value={inputCode} onChange={e => setInputCode(e.target.value.toUpperCase())} placeholder="tanvir@gmail.com or 64T95L" className="w-full h-10 pl-9 pr-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 text-sm font-mono font-bold outline-none focus:border-primary" /></div>
              </div>
              <div className="space-y-1.5">
                <div className="flex justify-between items-center"><label className="text-xs font-semibold flex items-center gap-1"><span className="material-symbols-outlined text-[16px] text-slate-400">lock</span> 4-Digit Security PIN</label><button type="button" onClick={() => toastFn('গুগল লগইন ব্যবহার করুন')} className="text-[10px] text-primary font-bold">Forgot PIN?</button></div>
                <div className="grid grid-cols-4 gap-2">
                  {[0, 1, 2, 3].map(idx => (<input key={idx} ref={pinRefs[idx]} type="password" inputMode="numeric" maxLength={1} value={pinDigits[idx]} onChange={e => handlePinChange(idx, e.target.value)} onKeyDown={e => handlePinKeyDown(idx, e)} placeholder="•" className="h-11 text-center text-lg font-extrabold rounded-xl bg-slate-100 dark:bg-slate-800 border-0 outline-none focus:ring-2 focus:ring-primary" />))}
                </div>
              </div>
              <button type="submit" disabled={authLoading} className="w-full h-11 rounded-xl bg-primary text-white font-bold text-sm flex items-center justify-center gap-1 shadow-md">
                {authLoading ? <div className="spinner"></div> : <>{authMode === 'signin' ? 'Log In' : 'Create Account'} <span className="material-symbols-outlined text-[18px]">arrow_forward</span></>}
              </button>
            </form>

            <div className="relative flex items-center justify-center py-1"><div className="w-full h-[1px] bg-slate-200 dark:bg-slate-700"></div><span className="absolute px-2 bg-white dark:bg-slate-900 text-slate-400 text-[10px] font-bold">OR QUICK CONNECT</span></div>
            <button onClick={handleGoogleLogin} disabled={authLoading} className="w-full h-11 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-xs flex items-center justify-center gap-2 hover:bg-slate-50 transition-all"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-4 h-4" alt="G" /> Continue with Google</button>
            <button onClick={() => { setAuthMode('signin'); toastFn('পার্টনারের কোড ও পিন উপরে দিন'); }} className="w-full h-11 rounded-xl bg-mint-surface text-secondary border border-emerald-200 font-bold text-xs flex items-center justify-center gap-2"><span className="material-symbols-outlined text-[18px]">key</span> Enter Spouse's Code</button>
            <div className="text-center pt-2"><button onClick={handleGuestLogin} className="text-[11px] text-slate-500 font-semibold hover:underline">Continue as Guest (Offline Mode)</button></div>
          </div>
          <div className="bg-slate-50 dark:bg-slate-800/50 p-3 text-center border-t border-slate-100 dark:border-slate-800"><p className="text-[10px] text-slate-400 flex items-center justify-center gap-1"><span className="material-symbols-outlined text-[14px] text-secondary">verified_user</span> 100% Free • End-to-End Encrypted</p></div>
        </div>
      </div>
    );
  }

  // ======================== MAIN APP ========================
  return (
    <div className={`${dark ? 'dark bg-slate-950' : 'bg-slate-200/70'} h-screen w-full flex justify-center items-center overflow-hidden select-none`}>
      <div className={`w-full max-w-[435px] h-full sm:h-[880px] ${dark ? 'bg-slate-900 text-slate-100 sm:border-slate-800' : 'bg-[#F8FAFC] text-[#0F172A] sm:border-white'} sm:rounded-[36px] sm:shadow-2xl sm:border-[6px] flex flex-col relative overflow-hidden`}>
        
        {toast && (<div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white px-4 py-2.5 rounded-full shadow-xl text-xs font-semibold flex items-center gap-2 border border-emerald-500/40 backdrop-blur-md"><span className="w-4 h-4 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] font-bold">✓</span><span>{toast}</span></div>)}

        <main className="flex-1 overflow-y-auto no-scrollbar px-4 pt-4 pb-32 space-y-4">
          
          {/* HOME TAB */}
          {tab === 'home' && (
            <div className="space-y-4">
              <div className="flex items-center justify-between px-0.5">
                <div><div className="flex items-center gap-1 text-slate-500 text-xs font-medium"><span className="material-symbols-outlined text-[15px]">calendar_today</span> {todayDateDisplay()}</div><h1 className="text-2xl font-headline font-extrabold mt-0.5">{t('আজকের বাজার', "Today's Bazar")}</h1></div>
                <div className="flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-50 text-[11px] font-bold text-emerald-700 border border-emerald-200 shadow-sm"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> {isGuest ? 'Offline' : 'Live Sync'}</div>
              </div>

              <div className="relative overflow-hidden rounded-2xl bg-gradient-to-br from-[#4338CA] via-[#4f46e5] to-[#6366F1] p-5 text-white shadow-[0_12px_30px_rgba(79,70,229,0.28)] border border-white/15">
                <div className="relative z-10 flex flex-col gap-4">
                  <div className="flex items-start justify-between">
                    <div><span className="text-[11px] font-semibold text-indigo-200 uppercase">Spent Today</span><div className="flex items-baseline gap-2 mt-1"><span className="text-3xl font-headline font-extrabold">৳{stats.spentToday.toLocaleString()}</span><span className="text-[11px] font-semibold text-indigo-100 bg-white/15 px-2 py-0.5 rounded-full">{stats.leftCount} left</span></div></div>
                    <button onClick={() => { setTempBudget(String(data.monthlyBudget || 0)); setShowBudget(true); }} className="flex items-center gap-1 bg-white/15 border border-white/20 px-2.5 py-1.5 rounded-full text-xs font-semibold"><span className="text-indigo-100">Budget:</span> <span className="font-bold text-white">৳{stats.budget.toLocaleString()}</span><span className="material-symbols-outlined text-[14px]">edit</span></button>
                  </div>
                  <div className="space-y-1.5">
                    <div className="flex justify-between text-xs font-medium text-indigo-100"><span>{stats.budgetPct}% Spent</span><span>Remaining: <span className="text-white font-bold">৳{stats.budgetRemaining.toLocaleString()}</span></span></div>
                    <div className="w-full bg-black/25 h-2.5 rounded-full overflow-hidden"><div className={`h-full rounded-full ${stats.budgetPct >= 100 ? 'bg-rose-400' : 'bg-emerald-400'}`} style={{ width: `${Math.min(100, stats.budgetPct)}%` }}></div></div>
                  </div>
                </div>
              </div>

              <h2 className="text-lg font-bold mb-4">Add Bill</h2>
              <form onSubmit={onAddBill} className="space-y-3">
                <div className="grid grid-cols-4 gap-2 mb-2">{BILL_TYPES.map(bt => (<button key={bt.id} type="button" onClick={() => { setBillType(bt.id); setBillName(lang==='bn'?bt.bnName+' বিল':bt.name+' Bill'); }} className={`p-2 rounded-lg border flex flex-col items-center ${billType === bt.id ? 'bg-emerald-900/40 border-emerald-500 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-400'}`}><span className="material-symbols-outlined text-[18px] mb-1">{bt.icon}</span><span className="text-[9px]">{bt.name}</span></button>))}</div>
                <input type="text" required placeholder="Bill Name" value={billName} onChange={e => setBillName(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none" />
                <input type="number" required placeholder="Amount (৳)" value={billAmount} onChange={e => setBillAmount(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none" />
                <input type="date" value={billDue} onChange={e => setBillDue(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none" />
                <button type="submit" className="w-full py-3 bg-primary text-white font-bold rounded-xl text-sm">Add Bill</button>
              </form>
            </div>
          </div>
        )}

        {/* MODAL: ADD LOAN */}
        {showAddLoan && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4" onClick={() => setShowAddLoan(false)}>
            <div className="bg-[#111827] text-white w-full max-w-[400px] rounded-3xl p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <h2 className="font-bold text-lg">Add Loan</h2>
              <form onSubmit={onAddLoan} className="space-y-3">
                <div className="grid grid-cols-2 gap-2"><button type="button" onClick={() => setLoanType('lent')} className={`p-2 rounded-xl border text-xs font-bold ${loanType === 'lent' ? 'bg-indigo-950 border-indigo-500 text-indigo-300' : 'bg-slate-800 text-slate-400'}`}>💚 Lent</button><button type="button" onClick={() => setLoanType('borrowed')} className={`p-2 rounded-xl border text-xs font-bold ${loanType === 'borrowed' ? 'bg-emerald-950 border-emerald-500 text-emerald-300' : 'bg-slate-800 text-slate-400'}`}>💔 Borrowed</button></div>
                <input type="text" required placeholder="Person Name" value={loanPerson} onChange={e => setLoanPerson(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none" />
                <input type="number" required placeholder="Amount (৳)" value={loanAmount} onChange={e => setLoanAmount(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none" />
                <input type="date" value={loanDate} onChange={e => setLoanDate(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none" />
                <button type="submit" className="w-full py-3 bg-primary text-white font-bold rounded-xl text-sm">Save Loan</button>
              </form>
            </div>
          </div>
        )}

        {/* MODAL: BUDGET (AI) */}
        {showBudget && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4" onClick={() => setShowBudget(false)}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <h3 className="font-bold text-base">Set Monthly Budget</h3>
              <form onSubmit={e => { e.preventDefault(); save({ ...data, monthlyBudget: Math.max(0, Number(tempBudget) || 0) }); setShowBudget(false); toastFn('Budget Updated ✔'); }} className="space-y-3">
                <input type="number" autoFocus value={tempBudget} onChange={e => setTempBudget(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border-2 border-primary rounded-xl px-3 py-2 text-xl font-bold outline-none" />
                <button type="submit" className="w-full bg-primary text-white font-bold py-2 rounded-xl text-sm">Save</button>
              </form>
              <div className="border-t dark:border-slate-700 pt-3"><button type="button" onClick={getBudgetSuggestion} disabled={isSuggesting} className="w-full py-2 bg-indigo-50 dark:bg-slate-900 text-primary dark:text-indigo-400 font-bold text-xs rounded-xl flex items-center justify-center gap-1">{isSuggesting ? <div className="spinner border-primary"></div> : <><span className="material-symbols-outlined text-[16px]">auto_awesome</span> Get AI Suggestion</>}</button>{aiBudgetSuggest && <p className="text-[11px] text-slate-500 mt-2 text-center bg-slate-50 dark:bg-slate-900 p-2 rounded-lg">{aiBudgetSuggest}</p>}</div>
            </div>
          </div>
        )}

        {/* MODAL: PRICE CONFIRM */}
        {priceItem && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setPriceItem(null)}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <div><span className="text-[10px] font-extrabold text-secondary uppercase">Bought!</span><h3 className="font-bold text-base">{priceItem.name}</h3></div>
              <form onSubmit={onConfirmPrice} className="space-y-3"><input type="number" autoFocus value={tempPrice} onChange={e => setTempPrice(e.target.value)} placeholder="0" className="w-full bg-slate-50 dark:bg-slate-900 border-2 border-primary rounded-xl px-3 py-2 text-xl font-bold outline-none" /><button type="submit" className="w-full bg-primary text-white font-bold py-2 rounded-xl text-sm">✓ Confirm</button></form>
            </div>
          </div>
        )}

        {/* MODAL: HISTORY DETAILS (EDIT PRICE) */}
        {selectedHist && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setSelectedHist(null)}>
            <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <div className="flex justify-between border-b dark:border-slate-700 pb-3"><div><h3 className="font-bold text-sm">{selectedHist.dateStr}</h3><p className="text-xs text-slate-400">Total: ৳{Number(selectedHist.totalSpent).toLocaleString()}</p></div><button onClick={() => setSelectedHist(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700">×</button></div>
              <div className="space-y-2 max-h-64 overflow-y-auto no-scrollbar">
                {(selectedHist.items || []).map((it, idx) => (
                  <div key={idx} className="flex items-center justify-between text-xs py-1.5 border-b border-slate-50 dark:border-slate-800">
                    <span>{it.bought ? '✅' : '⬜'} {it.name} {it.quantity && `(${it.quantity})`}</span>
                    <div className="flex items-center gap-2"><span className="font-bold">৳{Number(it.price || 0).toLocaleString()}</span>{editHistItem?.id === it.id ? (<form onSubmit={handleEditHistSubmit} className="flex items-center gap-1"><input type="number" autoFocus value={editHistPrice} onChange={e => setEditHistPrice(e.target.value)} className="w-12 border rounded px-1 text-[10px]" /><button type="submit" className="text-emerald-500 font-bold text-[10px]">OK</button></form>) : (<button onClick={() => { setEditHistItem(it); setEditHistPrice(String(it.price)); }} className="text-primary text-[10px]">✏️ Edit</button>)}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* MODAL: SHARE */}
        {showShare && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={() => setShowShare(false)}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-[435px] rounded-t-3xl sm:rounded-3xl p-5 space-y-3 shadow-2xl" onClick={e => e.stopPropagation()}>
              <div className="flex justify-between items-center"><h3 className="font-bold text-base">Share Bazar List</h3><button onClick={() => setShowShare(false)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700">×</button></div>
              <div className="bg-slate-50 dark:bg-slate-900 rounded-xl p-3 border max-h-44 overflow-y-auto"><pre className="text-[11px] whitespace-pre-wrap font-sans">{genShareText()}</pre></div>
              <div className="grid grid-cols-2 gap-2.5"><button onClick={() => { window.open(`https://wa.me/?text=${encodeURIComponent(genShareText())}`, '_blank'); setShowShare(false); }} className="bg-[#25D366] text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-1.5"><span>💬 WhatsApp</span></button><button onClick={() => { navigator.clipboard?.writeText(genShareText()); setShowShare(false); toastFn('Copied!'); }} className="bg-primary text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-1.5"><span>📋 Copy Text</span></button></div>
            </div>
          </div>
        )}

        {/* MODAL: EDIT MEMBER NAME */}
        {showEditName && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowEditName(false)}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <h3 className="font-bold text-base">✏️ Edit Member Name</h3>
              <form onSubmit={e => { e.preventDefault(); const u = (data.members || []).map(m => m.id === editNameId ? { ...m, name: tempName.trim() } : m); save({ ...data, members: u }); setShowEditName(false); toastFn('Updated ✔'); }} className="space-y-3"><input type="text" autoFocus value={tempName} onChange={e => setTempName(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl px-3 py-2 text-sm font-bold outline-none" /><button type="submit" className="w-full bg-primary text-white font-bold py-2 rounded-xl text-xs">Save</button></form>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
