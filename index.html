// Dynamic Months Logic (Last 12 months + Current)
const getDynamicMonths = () => {
  const months = [];
  const d = new Date();
  for (let i = 11; i >= 0; i--) {
    const past = new Date(d.getFullYear(), d.getMonth() - i, 1);
    const key = `${past.getFullYear()}-${String(past.getMonth() + 1).padStart(2, '0')}`;
    months.push({
      key,
      label: past.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
      bn: past.toLocaleDateString('bn-BD', { month: 'long', year: 'numeric' })
    });
  }
  return months;
};

const playSound = () => {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const c = new C();
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(660, c.currentTime);
    g.gain.setValueAtTime(0.15, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.25);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.25);
  } catch(e) {}
};

    const reader = new FileReader();
    reader.onload = async (ev) => {

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${data.geminiApiKey}`, {

        if (Array.isArray(parsed) && parsed.length > 0) {
          const newItems = parsed.map((item, idx) => ({
            id: 'ocr_' + Date.now() + idx, name: item.name, quantity: '1 pc', size: '', category: 'grocery', addedBy: myName, addedAt: nowStr(), bought: true, price: Number(item.price) || 0, lastPrice: Number(item.price) || 0, urgent: false, note: '📸 Receipt OCR'
          }));
          const u = [...newItems, ...(data.todayItems || [])];
          save({ ...data, todayItems: u });
          if (sound) playSound();
          setShowAdd(false);
          toastFn(`✅ ${parsed.length} ${t('টি আইটেম রসিদ থেকে যোগ হয়েছে!', 'items added from receipt!')}`);
        }
      } catch (err) {
        toastFn('❌ OCR Failed. Try again.');
      }
      setOcrLoading(false);
    };
    reader.readAsDataURL(file);
  };

  // Smart AI Text Parse
  const handleAiExtract = async () => {
    const promptText = aiPrompt.trim();
    if (!promptText) return toastFn(t('কিছু লিখুন', 'Type something'));

    if (!data.geminiApiKey) return toastFn(t('সেটিংসে API Key দিন', 'Add API Key in Settings'));

    setAiLoading(true);
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${data.geminiApiKey}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: `Extract items from: "${promptText}". Return JSON: [{'name': 'name', 'quantity': '1 kg'}]. No markdown.` }] }] })
      });
      const json = await res.json();
      const text = json.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
      const parsed = JSON.parse(text);

      if (Array.isArray(parsed)) {
        const newItems = parsed.map((item, idx) => ({
          id: 'ai_' + Date.now() + idx, name: item.name, quantity: item.quantity || 'None', size: '', category: 'grocery', addedBy: myName, addedAt: nowStr(), bought: false, price: 0, lastPrice: getPrevPrice(item.name), urgent: false, note: '✨ AI Add'
        }));
        const u = [...newItems, ...(data.todayItems || [])];
        save({ ...data, todayItems: u });
        if (sound) playSound();
        setAiPrompt(''); setShowAdd(false);
        toastFn(`✨ ${newItems.length} items added!`);
      }
    } catch (e) { toastFn('AI Parsing Failed'); }
    setAiLoading(false);
  };

  const getPrevPrice = (name) => {
    if (!name) return 0;
    const dict = data.priceHistory || {};
    const lower = name.toLowerCase().trim();
    for (const [k, v] of Object.entries(dict)) {
      if (lower.includes(k.toLowerCase())) return v;
    }
    return 0;
  };

  const onAddItem = (e) => {
    e.preventDefault();
    if (!iName.trim()) return;
    const prev = getPrevPrice(iName);
    const newItem = {
      id: 'i' + Date.now(), name: iName.trim(), quantity: iQty, size: iSize, category: iCat, addedBy: myName, addedAt: nowStr(), bought: false, price: Number(iPrice) || 0, lastPrice: prev || Number(iPrice) || 0, urgent: iUrgent, note: iNote.trim()
    };
    const u = [newItem, ...(data.todayItems || [])];
    save({ ...data, todayItems: u });
    if (sound) playSound();
    setIName(''); setIQty('None'); setISize('None'); setIPrice(''); setINote(''); setIUrgent(false); setShowAdd(false);
    toastFn(`"${newItem.name}" ${t('যোগ হয়েছে', 'added')}`);
  };

  const onToggleItem = (item) => {
    if (!item.bought) {
      setPriceItem(item);
      setTempPrice(item.price > 0 ? String(item.price) : item.lastPrice ? String(item.lastPrice) : getPrevPrice(item.name) ? String(getPrevPrice(item.name)) : '');
    } else {
      const u = (data.todayItems || []).map(i => i.id === item.id ? { ...i, bought: false } : i);
      save({ ...data, todayItems: u });
    }
  };

  const onConfirmPrice = (e) => {
    e.preventDefault();
    if (!priceItem) return;
    const p = Math.max(0, Number(tempPrice) || 0);
    const uPH = { ...(data.priceHistory || {}), [priceItem.name.toLowerCase()]: p };
    const uItems = (data.todayItems || []).map(i => i.id === priceItem.id ? { ...i, bought: true, price: p, lastPrice: p } : i);
    save({ ...data, priceHistory: uPH, todayItems: uItems });
    if (sound) playSound();
    setPriceItem(null); setTempPrice('');
  };

  const onFinishBazar = async () => {
    const bought = (data.todayItems || []).filter(i => i.bought);
    if (bought.length === 0) return toastFn(t('অন্তত ১টি আইটেম কিনুন!', 'Check at least 1 item!'));
    const total = bought.reduce((s, i) => s + (Number(i.price) || 0), 0);
    
    const sess = {
      dateStr: `${todayDateDisplay()} (${nowStr()})`,
      monthKey: currentMonthKey,
      boughtCount: bought.length,
      totalCount: data.todayItems.length,
      totalSpent: total,
      sender: myName,
      tag: 'Completed',
      items: [...data.todayItems],
      timestamp: Date.now()
    };

    if (db && !isGuest) {
      await db.collection('families').doc(familyCode).collection('history').add(sess);
    } else {
      // Local save for guest
      const localHist = JSON.parse(localStorage.getItem('bb_history') || '[]');
      localHist.unshift({ id: 'h'+Date.now(), ...sess });
      localStorage.setItem('bb_history', JSON.stringify(localHist));
      setHistoryData(localHist);
    }

    const rem = (data.todayItems || []).filter(i => !i.bought);
    save({ ...data, todayItems: rem });
    if (sound) playSound();
    toastFn(t('🎉 বাজার হিস্ট্রিতে সেভ হয়েছে!', '🎉 Bazar archived!'));
    setBazarSubTab('history');
  };

  // Edit Price in History
  const handleEditHistSubmit = async (e) => {
    e.preventDefault();
    if (!editHistItem || !selectedHist) return;
    const newP = Number(editHistPrice) || 0;
    
    // Update in selectedHist items
    const updatedItems = selectedHist.items.map(it => it.id === editHistItem.id ? { ...it, price: newP } : it);
    const newTotal = updatedItems.filter(i => i.bought).reduce((s, i) => s + (Number(i.price) || 0), 0);
    
    const updatedSess = { ...selectedHist, items: updatedItems, totalSpent: newTotal };

    if (db && !isGuest) {
      await db.collection('families').doc(familyCode).collection('history').doc(selectedHist.id).update({
        items: updatedItems, totalSpent: newTotal
      });
    } else {
      const localHist = JSON.parse(localStorage.getItem('bb_history') || '[]');
      const idx = localHist.findIndex(h => h.id === selectedHist.id);
      if(idx > -1) localHist[idx] = updatedSess;
      localStorage.setItem('bb_history', JSON.stringify(localHist));
      setHistoryData(localHist);
    }
    setSelectedHist(updatedSess);
    setEditHistItem(null);
    toastFn('Price Updated ✔');
  };

  // Stats Calculation
  const stats = useMemo(() => {
    const items = data.todayItems || [];
    const bought = items.filter(i => i.bought);
    const unbought = items.filter(i => !i.bought);
    const bazarSpentToday = bought.reduce((s, i) => s + (Number(i.price) || 0), 0);
    const remainingEst = unbought.reduce((s, i) => s + getPrevPrice(i.name), 0);
    const estTotal = bazarSpentToday + remainingEst;

    const todayISO = new Date().toISOString().split('T')[0];
    const paidBills = (data.bills || []).filter(b => b.paid);
    const billsPaidToday = paidBills.filter(b => b.paidDate === todayISO).reduce((s, b) => s + Number(b.amount || 0), 0);
    const spentToday = bazarSpentToday + billsPaidToday;

    const monthHist = historyData.filter(h => h.monthKey === activeMonth.key);
    const histSpent = monthHist.reduce((s, h) => s + (Number(h.totalSpent) || 0), 0);
    const monthBillsTotal = paidBills.filter(b => !b.paidDate || b.paidDate.startsWith(activeMonth.key)).reduce((s, b) => s + Number(b.amount || 0), 0);

    const isCurrentMonth = activeMonth.key === currentMonthKey;
    const monthTotal = histSpent + monthBillsTotal + (isCurrentMonth ? bazarSpentToday : 0);

    const budget = Number(data.monthlyBudget) || 0;
    const budgetPct = budget > 0 ? Math.round((monthTotal / budget) * 100) : 0;
    const budgetRemaining = Math.max(0, budget - monthTotal);
    const trackedDays = Math.max(1, monthHist.length + (bazarSpentToday > 0 ? 1 : 0));
    const dailyAvg = monthTotal > 0 ? Math.round(monthTotal / trackedDays) : 0;

    return { total: items.length, boughtCount: bought.length, leftCount: unbought.length, urgentCount: items.filter(i => i.urgent && !i.bought).length, bazarSpentToday, remainingEst, estTotal, spentToday, cartProgress: items.length > 0 ? Math.round((bought.length / items.length) * 100) : 0, monthTotal, budget, budgetPct, budgetRemaining, dailyAvg };
  }, [data, activeMonth, historyData, currentMonthKey]);

  // Login Screen Render
  if (!familyCode) {
    return (
      <div className={`${dark ? 'dark bg-slate-950 text-white' : 'bg-slate-100 text-slate-900'} h-screen w-full flex flex-col items-center justify-center p-4`}>
        <div className="w-full max-w-[400px] bg-white dark:bg-slate-900 rounded-3xl shadow-xl overflow-hidden border border-slate-200 dark:border-slate-800">
          
          <div className="bg-primary/5 p-6 flex flex-col items-center border-b border-slate-100 dark:border-slate-800">
            <div className="w-20 h-20 rounded-2xl bg-white shadow-sm flex items-center justify-center mb-3 overflow-hidden border border-slate-100">
               <img src="icon-192.png" alt="Logo" className="w-full h-full object-cover" onError={(e)=>e.target.style.display='none'} />
               <span className="text-4xl absolute -z-10">🧺</span>
            </div>
            <h1 className="text-2xl font-headline font-extrabold flex items-center gap-1">Bou Bolche <span className="text-primary text-sm font-bold">(বউ বলছে)</span></h1>
            <p className="text-[11px] text-slate-500 mt-1 text-center">Family Daily Bazar, Budget & Shared Expense Ledger</p>
            <div className="mt-3 inline-flex items-center gap-1 px-3 py-1 bg-indigo-50 text-primary rounded-full text-[10px] font-bold">
              <span className="material-symbols-outlined text-[14px]">groups</span> Instant Couple & Family Sync
            </div>
          </div>

          <div className="p-5 space-y-4">

              <button onClick={() => setAuthMode('signin')} className={`py-2 rounded-lg text-xs font-bold transition-all ${authMode === 'signin' ? 'bg-white dark:bg-slate-900 text-primary shadow-sm' : 'text-slate-500'}`}>Sign In</button>
              <button onClick={() => setAuthMode('signup')} className={`py-2 rounded-lg text-xs font-bold transition-all ${authMode === 'signup' ? 'bg-white dark:bg-slate-900 text-primary shadow-sm' : 'text-slate-500'}`}>New Family Setup</button>
            </div>

            <form onSubmit={handleAuthSubmit} className="space-y-3.5">
              {authMode === 'signup' && (
                <div className="space-y-1">
                  <label className="text-xs font-semibold">Your Name *</label>
                  <div className="relative">
                    <span className="absolute left-3 top-2.5 material-symbols-outlined text-slate-400 text-[18px]">person</span>
                    <input type="text" value={inputName} onChange={e => setInputName(e.target.value)} placeholder="e.g. Tanvir" className="w-full h-10 pl-9 pr-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none focus:border-primary" />
                  </div>
                </div>
              )}

              <div className="space-y-1">
                <div className="flex justify-between items-center">
                  <label className="text-xs font-semibold">Gmail or Family Code</label>
                  <span className="text-[10px] text-slate-400">e.g. 64T95L</span>
                </div>
                <div className="relative">
                  <span className="absolute left-3 top-2.5 material-symbols-outlined text-slate-400 text-[18px]">alternate_email</span>
                  <input type="text" value={inputCode} onChange={e => setInputCode(e.target.value.toUpperCase())} placeholder="tanvir@gmail.com or 64T95L" className="w-full h-10 pl-9 pr-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-mono font-bold outline-none focus:border-primary" />
                </div>
              </div>

              <div className="space-y-1.5">
                <div className="flex justify-between items-center">
                  <label className="text-xs font-semibold flex items-center gap-1"><span className="material-symbols-outlined text-[16px] text-slate-400">lock</span> 4-Digit Security PIN</label>
                  <button type="button" onClick={() => toastFn('লগইন করতে গুগল বাটন ব্যবহার করুন', 'Use Google button to recover')} className="text-[10px] text-primary font-bold">Forgot PIN?</button>
                </div>
                <div className="grid grid-cols-4 gap-2">
                  {[0, 1, 2, 3].map(idx => (
                    <input key={idx} ref={pinRefs[idx]} type="password" inputMode="numeric" maxLength={1} value={pinDigits[idx]} onChange={e => handlePinChange(idx, e.target.value)} onKeyDown={e => handlePinKeyDown(idx, e)} placeholder="•" className="h-11 text-center text-lg font-extrabold rounded-xl bg-slate-100 dark:bg-slate-800 border-0 outline-none focus:ring-2 focus:ring-primary" />
                  ))}
                </div>
              </div>

              <button type="submit" disabled={authLoading} className="w-full h-11 rounded-xl bg-primary hover:bg-deep-violet text-white font-bold text-sm flex items-center justify-center gap-1 shadow-md">
                {authLoading ? <div className="spinner"></div> : <>{authMode === 'signin' ? 'Log In to Family Space' : 'Create Shared Family Hub'} <span className="material-symbols-outlined text-[18px]">arrow_forward</span></>}
              </button>
            </form>

            <div className="relative flex items-center justify-center py-1">
              <div className="w-full h-[1px] bg-slate-200 dark:bg-slate-700"></div>
              <span className="absolute px-2 bg-white dark:bg-slate-900 text-slate-400 text-[10px] font-bold">OR QUICK CONNECT</span>
            </div>

            <button onClick={handleGoogleLogin} disabled={authLoading} className="w-full h-11 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-xs flex items-center justify-center gap-2 hover:bg-slate-50 transition-all">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-4 h-4" alt="G" /> Continue with Google (1-Tap Sync)
            </button>
            
            <button onClick={() => { setAuthMode('signin'); toastFn('পার্টনারের কোড ও পিন উপরে দিন'); }} className="w-full h-11 rounded-xl bg-mint-surface text-secondary border border-emerald-200 font-bold text-xs flex items-center justify-center gap-2">
              <span className="material-symbols-outlined text-[18px]">key</span> Enter Spouse's Invite Code
            </button>

            <div className="text-center pt-2">
               <button onClick={handleGuestLogin} className="text-[11px] text-slate-500 font-semibold hover:underline">Continue as Guest (Offline Mode)</button>
            </div>
          </div>
          
          <div className="bg-slate-50 dark:bg-slate-800/50 p-3 text-center border-t border-slate-100 dark:border-slate-800">
             <p className="text-[10px] text-slate-400 flex items-center justify-center gap-1"><span className="material-symbols-outlined text-[14px] text-secondary">verified_user</span> 100% Free • End-to-End Encrypted • No SMS Charges</p>
          </div>
        </div>
      </div>
    );
  }

  // Main App Render
  return (
    <div className={`${dark ? 'dark bg-slate-950' : 'bg-slate-200/70'} h-screen w-full flex justify-center items-center overflow-hidden`}>
      <div className={`w-full max-w-[435px] h-full sm:h-[880px] ${dark ? 'bg-slate-900 text-slate-100 sm:border-slate-800' : 'bg-[#F8FAFC] text-slate-900 sm:border-white'} sm:rounded-[36px] sm:shadow-2xl sm:border-[6px] flex flex-col relative overflow-hidden`}>
        
        {toast && (
          <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white px-4 py-2.5 rounded-full shadow-xl text-xs font-semibold flex items-center gap-2 border border-emerald-500/40 backdrop-blur-md">
            <span className="w-4 h-4 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] font-bold">✓</span>
            <span>{toast}</span>
          </div>
        )}

        <main className="flex-1 overflow-y-auto no-scrollbar px-4 pt-4 pb-32 space-y-4">
          
          {/* HOME TAB */}
          {tab === 'home' && (
            <div className="space-y-4">
              <div className="flex items-center justify-between px-0.5">
                <div>
                  <div className="flex items-center gap-1 text-slate-500 text-xs font-medium">
                    <span className="material-symbols-outlined text-[15px]">calendar_today</span> {todayDateDisplay()}
                  </div>
                  <h1 className="text-2xl font-headline font-extrabold mt-0.5">{t('আজকের বাজার', "Today's Bazar")}</h1>
                </div>
                <div className="flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-50 text-[11px] font-bold text-emerald-700 border border-emerald-200 shadow-sm">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> {isGuest ? 'Offline Mode' : 'Live Sync'}
                </div>
              </div>

              <div className="relative overflow-hidden rounded-2xl bg-gradient-to-br from-[#4338CA] via-[#4f46e5] to-[#6366F1] p-5 text-white shadow-xl">
                <div className="relative z-10 flex flex-col gap-4">
                  <div className="flex items-start justify-between">
                    <div>
                      <span className="text-[11px] font-semibold text-indigo-200 uppercase">Spent Today</span>
                      <div className="flex items-baseline gap-2 mt-1">
                        <span className="text-3xl font-headline font-extrabold">৳{stats.spentToday.toLocaleString()}</span>
                        <span className="text-[11px] font-semibold text-indigo-100 bg-white/15 px-2 py-0.5 rounded-full">{stats.leftCount} left</span>
                      </div>
                    </div>
                    <button onClick={() => { setTempBudget(String(data.monthlyBudget || 0)); setShowBudget(true); }} className="flex items-center gap-1 bg-white/15 border border-white/20 px-2.5 py-1.5 rounded-full text-xs font-semibold">
                      <span className="text-indigo-100">Budget:</span> <span className="font-bold text-white">৳{stats.budget.toLocaleString()}</span>
                      <span className="material-symbols-outlined text-[14px]">edit</span>
                    </button>
                  </div>
                  <div className="space-y-1.5">
                    <div className="flex justify-between text-xs font-medium text-indigo-100">
                      <span>{stats.budgetPct}% Spent</span>
                      <span>Remaining: <span className="text-white font-bold">৳{stats.budgetRemaining.toLocaleString()}</span></span>
                    </div>
                    <div className="w-full bg-black/25 h-2.5 rounded-full overflow-hidden">
                      <div className={`h-full rounded-full ${stats.budgetPct >= 100 ? 'bg-rose-400' : 'bg-emerald-400'}`} style={{ width: `${Math.min(100, stats.budgetPct)}%` }}></div>
                    </div>
                  </div>
                </div>
              </div>

              <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 shadow-sm">
                <div className="flex justify-between items-center mb-3">
                  <div className="flex items-center gap-2">
                    <div className="w-7 h-7 rounded-lg bg-indigo-50 flex items-center justify-center text-primary"><span className="material-symbols-outlined text-[18px]">shopping_basket</span></div>
                    <h3 className="font-headline font-bold text-sm">Today's Smart Bazar</h3>
                  </div>
                  <button onClick={() => setTab('bazar')} className="text-xs font-bold text-primary flex items-center gap-0.5">View All <span className="material-symbols-outlined text-[15px]">arrow_forward</span></button>
                </div>
                
                {(data.todayItems || []).length === 0 ? (
                  <div className="py-5 text-center border border-dashed border-slate-200 rounded-xl"><p className="text-xs text-slate-400">No items in list yet!</p></div>
                ) : (
                  <div className="flex flex-col gap-2">
                    {(data.todayItems || []).slice(0, 3).map(item => (
                      <div key={item.id} onClick={() => onToggleItem(item)} className={`flex items-center justify-between p-2.5 rounded-xl border cursor-pointer ${item.bought ? 'bg-slate-50 border-slate-100 opacity-70' : 'bg-white border-slate-200'}`}>
                        <div className="flex items-center gap-2.5">
                          <div className={`w-5 h-5 rounded-md flex items-center justify-center ${item.bought ? 'bg-secondary text-white' : 'border-2 border-slate-300'}`}>{item.bought && <span className="material-symbols-outlined text-[14px]">check</span>}</div>
                          <p className={`text-xs font-semibold ${item.bought ? 'line-through text-slate-400' : ''}`}>{item.name} <span className="text-slate-400 font-normal">({item.quantity})</span></p>
                        </div>
                        <span className="text-xs font-bold">{item.price > 0 ? `৳${item.price}` : (item.lastPrice > 0 ? `~৳${item.lastPrice}` : '+ Price')}</span>
                      </div>
                    ))}
                  </div>
                )}
                <button onClick={() => setShowAdd(true)} className="w-full mt-3 py-3 bg-emerald-600 text-white font-bold text-sm rounded-xl flex items-center justify-center gap-2">
                  <span className="material-symbols-outlined text-[20px]">add_circle</span> + Add New Item
                </button>
              </div>
            </div>
          )}

          {/* BAZAR TAB */}
          {tab === 'bazar' && (
            <div className="space-y-4">
              <div className="flex items-center justify-between">
                <h1 className="font-headline text-2xl font-extrabold">{t('স্মার্ট বাজার', 'Smart Bazar')}</h1>
                <div className="flex items-center gap-1 bg-indigo-50 p-1 rounded-xl">
                  <button onClick={() => setBazarSubTab('today')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${bazarSubTab === 'today' ? 'bg-white text-primary shadow-sm' : 'text-slate-500'}`}>Today</button>
                  <button onClick={() => setBazarSubTab('history')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${bazarSubTab === 'history' ? 'bg-white text-primary shadow-sm' : 'text-slate-500'}`}>History</button>
                </div>
              </div>

              {bazarSubTab === 'today' ? (
                <>
                  <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                    <div className="flex justify-between">
                      <div>
                        <span className="text-[10px] font-bold text-slate-400 uppercase">Estimated Total</span>
                        <div className="font-headline text-xl font-extrabold">৳{stats.estTotal.toLocaleString()}</div>
                      </div>
                      <div className="text-right">
                        <span className="text-[10px] font-bold text-secondary uppercase">Actual Spent</span>
                        <div className="font-headline text-xl font-extrabold text-secondary">৳{stats.bazarSpentToday.toLocaleString()}</div>
                      </div>
                    </div>
                    <div className="w-full h-2 rounded-full bg-indigo-50 overflow-hidden">
                      <div className="h-full rounded-full bg-primary" style={{ width: `${stats.cartProgress}%` }}></div>
                    </div>
                  </div>

                  <div className="space-y-2">
                    {(data.todayItems || []).map(item => (
                      <div key={item.id} className={`p-3.5 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center justify-between ${item.bought ? 'opacity-70' : ''}`}>
                        <div onClick={() => onToggleItem(item)} className="flex items-center gap-3 flex-1 cursor-pointer">
                          <div className={`w-5 h-5 rounded-md flex items-center justify-center ${item.bought ? 'bg-secondary text-white' : 'border-2 border-slate-300'}`}>{item.bought && <span className="material-symbols-outlined text-[15px]">check</span>}</div>
                          <div>
                            <p className={`font-bold text-sm ${item.bought ? 'line-through text-slate-400' : ''}`}>{item.name} ({item.quantity})</p>
                            <p className="text-[10px] text-slate-400">👤 {item.addedBy} {item.size !== 'None' && `• [${item.size}]`}</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-1">
                          <button onClick={() => { setPriceItem(item); setTempPrice(item.price > 0 ? String(item.price) : ''); }} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${item.bought ? 'text-secondary bg-emerald-50' : 'text-primary bg-indigo-50'}`}>
                            {item.price > 0 ? `৳${item.price}` : '+ Price'}
                          </button>
                          <button onClick={() => { const u = data.todayItems.filter(i => i.id !== item.id); save({...data, todayItems: u}); }} className="text-slate-300 hover:text-rose-500 p-1"><span className="material-symbols-outlined text-[18px]">delete</span></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </>
              ) : (
                <div className="space-y-3">
                  {historyData.length === 0 ? (
                    <div className="text-center py-10 bg-white rounded-2xl border border-dashed"><p className="text-xs text-slate-400">No history found</p></div>
                  ) : (
                    historyData.map(h => (
                      <div key={h.id} onClick={() => setSelectedHist(h)} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between cursor-pointer">
                        <div>
                          <span className="font-bold text-sm">{h.dateStr}</span>
                          <p className="text-[11px] text-slate-400 mt-0.5">{h.boughtCount}/{h.totalCount} items • 👤 {h.sender}</p>
                        </div>
                        <div className="font-extrabold text-sm text-primary">৳{Number(h.totalSpent || 0).toLocaleString()} <span className="material-symbols-outlined text-[16px] align-middle">chevron_right</span></div>
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>
          )}

          {/* EXPENSES TAB */}
          {tab === 'expenses' && (
            <div className="space-y-4">
              <div className="flex justify-between items-center">
                <h1 className="font-headline text-2xl font-extrabold">Expenses</h1>
                <div className="flex items-center bg-white px-2 py-1 rounded-full border shadow-sm">
                  <button onClick={() => setMonthIdx(i => Math.max(0, i - 1))} className="p-0.5 text-slate-400"><span className="material-symbols-outlined text-[16px]">chevron_left</span></button>
                  <span className="text-xs px-2 font-bold">{lang === 'bn' ? activeMonth.bn : activeMonth.label}</span>
                  <button onClick={() => setMonthIdx(i => Math.min(MONTHS.length - 1, i + 1))} className="p-0.5 text-slate-400"><span className="material-symbols-outlined text-[16px]">chevron_right</span></button>
                </div>
              </div>

              <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[10px] uppercase font-bold text-slate-400">Monthly Budget</span>
                    <div className="flex items-baseline gap-1 mt-1">
                      <span className="font-extrabold text-2xl">৳{stats.monthTotal.toLocaleString()}</span>
                      <span className="text-xs text-slate-400">/ ৳{stats.budget.toLocaleString()}</span>
                    </div>
                  </div>
                  <span className="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600 text-[10px] font-bold">৳{stats.budgetRemaining.toLocaleString()} left</span>
                </div>
                <div className="w-full bg-indigo-50 h-2.5 rounded-full mt-3 overflow-hidden">
                  <div className="h-full bg-primary" style={{ width: `${Math.min(100, stats.budgetPct)}%` }}></div>
                </div>
              </div>

              <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-2">
                <div className="flex justify-between items-center"><span className="text-xs font-bold uppercase text-slate-500">Bills & Utilities</span><button onClick={() => setShowAddBill(true)} className="text-[11px] font-bold text-primary">+ Add</button></div>
                {(data.bills || []).length === 0 ? <p className="text-xs text-slate-400 py-2">No bills added</p> : (data.bills || []).map(bill => {
                  const bt = BILL_TYPES.find(x => x.id === bill.type) || BILL_TYPES[0];
                  return (
                    <div key={bill.id} className="flex items-center justify-between p-2 rounded-xl hover:bg-slate-50 border border-transparent hover:border-slate-100 transition-all">
                      <div className="flex items-center gap-2">
                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${bt.bg}`}><span className="material-symbols-outlined text-[16px]">{bt.icon}</span></div>
                        <div>
                          <p className={`text-xs font-bold ${bill.paid ? 'line-through text-slate-400' : ''}`}>{bill.name}</p>
                          <p className={`text-[10px] ${bill.paid ? 'text-secondary' : 'text-rose-500'}`}>{bill.paid ? 'Paid' : `Due: ${bill.dueDate}`}</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-extrabold">৳{bill.amount}</span>
                        <button onClick={() => { const u = data.bills.map(b => b.id === bill.id ? { ...b, paid: !b.paid, paidDate: !b.paid ? new Date().toISOString().split('T')[0] : null } : b); save({...data, bills: u}); }} className={`px-2 py-1 rounded text-[10px] font-bold ${bill.paid ? 'bg-emerald-50 text-emerald-600' : 'bg-primary text-white'}`}>{bill.paid ? 'Paid' : 'Pay'}</button>
                      </div>
                    </div>
                  )
                })}
              </div>
            </div>
          )}

          {/* SETTINGS TAB */}
          {tab === 'settings' && (
            <div className="space-y-4">
              <h1 className="font-headline text-2xl font-extrabold">Settings</h1>
              
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                <div className="flex items-center gap-2 text-xs font-bold uppercase text-slate-500"><span className="material-symbols-outlined text-[18px] text-primary">tune</span> Preferences</div>
                <div className="flex items-center justify-between p-2 rounded-xl bg-slate-50">
                  <span className="text-xs font-bold">Appearance</span>
                  <button onClick={() => { setDark(!dark); localStorage.setItem('bb_dark', String(!dark)); }} className={`w-10 h-5 rounded-full p-0.5 transition-colors ${dark ? 'bg-primary' : 'bg-slate-300'}`}><span className={`block w-4 h-4 rounded-full bg-white transform transition-transform ${dark ? 'translate-x-5' : 'translate-x-0'}`}></span></button>
                </div>
                <div className="flex items-center justify-between p-2 rounded-xl bg-slate-50">
                  <span className="text-xs font-bold">Language</span>
                  <div className="flex p-0.5 bg-slate-200 rounded-lg">
                    <button onClick={() => { setLang('bn'); localStorage.setItem('bb_lang', 'bn'); }} className={`px-2 py-1 rounded text-[10px] font-bold ${lang === 'bn' ? 'bg-white text-primary' : 'text-slate-500'}`}>বাংলা</button>
                    <button onClick={() => { setLang('en'); localStorage.setItem('bb_lang', 'en'); }} className={`px-2 py-1 rounded text-[10px] font-bold ${lang === 'en' ? 'bg-white text-primary' : 'text-slate-500'}`}>English</button>
                  </div>
                </div>
              </div>

              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2">
                <div className="flex items-center gap-2 text-xs font-bold uppercase text-slate-500 mb-1"><span className="material-symbols-outlined text-[18px] text-primary">auto_awesome</span> AI Configuration</div>
                <p className="text-[10px] text-slate-400">Enter Gemini API Key to enable Receipt OCR, Budget Suggestion & Smart Parsing.</p>
                <div className="flex gap-2">
                  <input type="password" value={tempApiKey} onChange={e => setTempApiKey(e.target.value)} placeholder="AIzaSy..." className="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs outline-none" />
                  <button onClick={() => { save({ ...data, geminiApiKey: tempApiKey.trim() }); toastFn('API Key Saved ✔'); }} className="px-3 py-1.5 bg-primary text-white text-xs font-bold rounded-lg">Save</button>
                </div>
              </div>

              <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="w-full py-3 rounded-xl bg-rose-50 text-rose-600 font-bold text-xs flex items-center justify-center gap-1 border border-rose-200">
                <span className="material-symbols-outlined text-[18px]">logout</span> Log Out
              </button>
            </div>
          )}
        </main>

        {/* FLOATING ACTION DOCK */}
        {tab === 'bazar' && bazarSubTab === 'today' && (
          <div className={`absolute bottom-16 left-0 right-0 z-30 px-4 py-2.5 ${dark ? 'bg-slate-900/95 border-slate-800' : 'bg-white/95 border-slate-200'} backdrop-blur-md border-t shadow-lg`}>
            <div className="flex items-center justify-between gap-2.5">
              <div className="px-3 py-1 bg-slate-100 rounded-xl">
                <span className="text-[9px] text-slate-500 font-bold block">Total</span>
                <span className="font-extrabold text-sm text-secondary">৳{stats.bazarSpentToday}</span>
              </div>
              <div className="flex gap-2 flex-1 justify-end">
                <button onClick={() => setShowAdd(true)} className="flex-1 h-10 px-3 rounded-xl bg-primary text-white text-xs font-bold flex items-center justify-center gap-1"><span className="material-symbols-outlined text-[17px]">add</span> Add Item</button>
                <button onClick={onFinishBazar} className="h-10 px-3 rounded-xl bg-secondary text-white text-xs font-bold flex items-center justify-center gap-1"><span className="material-symbols-outlined text-[17px]">check_circle</span> Finish</button>
              </div>
            </div>
          </div>
        )}

        {/* BOTTOM NAVIGATION */}
        <nav className={`flex-none h-16 ${dark ? 'bg-slate-900/95 border-slate-800' : 'bg-white/95 border-slate-200'} backdrop-blur-xl border-t px-2 flex justify-around items-center z-40`}>
          {[
            { id: 'home', icon: 'home', label: 'Home' },
            { id: 'bazar', icon: 'shopping_basket', label: 'Bazar' },
            { id: 'expenses', icon: 'payments', label: 'Expenses' },
            { id: 'settings', icon: 'settings', label: 'Settings' }
          ].map(nav => (
            <button key={nav.id} onClick={() => setTab(nav.id)} className={`flex flex-col items-center justify-center gap-0.5 py-1 px-3 rounded-xl ${tab === nav.id ? 'text-primary font-bold' : 'text-slate-400'}`}>
              <span className={`material-symbols-outlined text-[22px] ${tab === nav.id ? 'icon-fill' : ''}`}>{nav.icon}</span>
              <span className="text-[11px] tracking-tight">{nav.label}</span>
            </button>
          ))}
        </nav>

        {/* MODAL: ADD ITEM (With AI & OCR) */}
        {showAdd && (
          <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/60 backdrop-blur-sm" onClick={() => setShowAdd(false)}>
            <div className="w-full max-w-[435px] bg-[#182234] text-slate-100 rounded-t-3xl sm:rounded-2xl shadow-2xl flex flex-col max-h-[92vh] overflow-hidden" onClick={e => e.stopPropagation()}>
              <div className="flex items-center justify-between px-5 py-3 border-b border-slate-700/50">
                <h2 className="text-base font-headline font-extrabold">Add Item</h2>
                <button onClick={() => setShowAdd(false)} className="text-slate-400">✕</button>
              </div>
              <div className="overflow-y-auto px-5 py-4 space-y-4 text-xs no-scrollbar">
                
                {/* AI & OCR Box */}
                <div className="rounded-xl bg-[#1e293b] border border-emerald-500/30 p-3 space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="font-bold text-white text-xs flex items-center gap-1"><span className="material-symbols-outlined text-[14px]">auto_awesome</span> AI & OCR</span>
                    <button onClick={() => fileInputRef.current.click()} className="text-[10px] bg-emerald-600 text-white px-2 py-1 rounded-lg font-bold flex items-center gap-1">
                      {ocrLoading ? <div className="spinner"></div> : <><span className="material-symbols-outlined text-[14px]">photo_camera</span> Receipt</>}
                    </button>
                    <input type="file" accept="image/*" ref={fileInputRef} onChange={handleReceiptUpload} className="hidden" />
                  </div>
                  <div className="relative flex items-center">
                    <input type="text" value={aiPrompt} onChange={e => setAiPrompt(e.target.value)} placeholder="২ কেজি আলু, ১ ডজন ডিম..." className="w-full bg-[#121a29] border border-emerald-500/40 rounded-lg pl-3 pr-10 py-2 text-xs text-white outline-none" />
                    <button onClick={handleAiExtract} disabled={aiLoading} className="absolute right-1 p-1.5 rounded bg-emerald-600 text-white">
                      {aiLoading ? <div className="spinner"></div> : <span className="material-symbols-outlined text-[16px]">arrow_forward</span>}
                    </button>
                  </div>
                </div>

                <form onSubmit={onAddItem} className="space-y-3">
                  <div>
                    <label className="text-slate-300 font-bold block mb-1">Item Name *</label>
                    <input type="text" required value={iName} onChange={e => setIName(e.target.value)} placeholder="e.g. Apple 2 kg" className="w-full bg-[#121a29] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Quantity</label>
                      <select value={iQty} onChange={e => setIQty(e.target.value)} className="w-full bg-[#121a29] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none">
                        {QUICK_WEIGHTS.map(w => <option key={w} value={w}>{w}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Size (Optional)</label>
                      <select value={iSize} onChange={e => setISize(e.target.value)} className="w-full bg-[#121a29] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none">
                        {SIZES.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-300 font-bold block mb-1">Price (৳) Optional</label>
                    <input type="number" value={iPrice} onChange={e => setIPrice(e.target.value)} placeholder="0" className="w-full bg-[#121a29] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none" />
                  </div>

                  <div>
                    <label className="text-slate-300 font-bold block mb-1">Category</label>
                    <div className="grid grid-cols-3 gap-2">
                      {CATS.map(c => (
                        <button key={c.id} type="button" onClick={() => setICat(c.id)} className={`p-2 rounded-lg border text-[11px] ${iCat === c.id ? 'bg-emerald-900/50 border-emerald-500 text-emerald-300' : 'bg-[#121a29] border-slate-700 text-slate-400'}`}>{c.emoji} {c.name}</button>
                      ))}
                    </div>
                  </div>

                  <button type="submit" className="w-full py-3 mt-2 rounded-xl bg-emerald-600 text-white font-bold text-sm shadow-lg">+ Add to List</button>
                </form>
              </div>
            </div>
          </div>
        )}

        {/* MODAL: ADD BILL */}
        {showAddBill && (
          <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/60 backdrop-blur-sm" onClick={() => setShowAddBill(false)}>
            <div className="w-full max-w-[435px] bg-[#111827] text-white rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl" onClick={e => e.stopPropagation()}>
              <h2 className="text-lg font-bold mb-4">Add Bill</h2>
              <form onSubmit={e => { e.preventDefault(); const nb = { id: 'b'+Date.now(), name: billName, type: billType, amount: Number(billAmount), dueDate: billDue, paid: false }; save({...data, bills: [nb, ...(data.bills||[])]}); setBillName(''); setBillAmount(''); setShowAddBill(false); toastFn('Bill Added ✔'); }} className="space-y-3">
                <div className="grid grid-cols-4 gap-2 mb-2">
                  {BILL_TYPES.map(bt => (
                    <button key={bt.id} type="button" onClick={() => { setBillType(bt.id); setBillName(lang==='bn'?bt.bnName+' বিল':bt.name+' Bill'); }} className={`p-2 rounded-lg border flex flex-col items-center ${billType === bt.id ? 'bg-emerald-900/40 border-emerald-500 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                      <span className="material-symbols-outlined text-[18px] mb-1">{bt.icon}</span><span className="text-[9px]">{bt.name}</span>
                    </button>
                  ))}
                </div>
                <input type="text" required placeholder="Bill Name" value={billName} onChange={e => setBillName(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none" />
                <input type="number" required placeholder="Amount (৳)" value={billAmount} onChange={e => setBillAmount(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none" />
                <input type="date" value={billDue} onChange={e => setBillDue(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none" />
                <button type="submit" className="w-full py-3 bg-primary text-white font-bold rounded-xl text-sm">Add Bill</button>
              </form>
            </div>
          </div>
        )}

        {/* MODAL: BUDGET & AI SUGGESTION */}
        {showBudget && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4" onClick={() => setShowBudget(false)}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <h3 className="font-bold text-base">Set Monthly Budget</h3>
              <form onSubmit={e => { e.preventDefault(); save({ ...data, monthlyBudget: Math.max(0, Number(tempBudget) || 0) }); setShowBudget(false); toastFn('Budget Updated ✔'); }} className="space-y-3">
                <input type="number" autoFocus value={tempBudget} onChange={e => setTempBudget(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border-2 border-primary rounded-xl px-3 py-2 text-xl font-bold outline-none" />
                <button type="submit" className="w-full bg-primary text-white font-bold py-2 rounded-xl text-sm">Save</button>
              </form>
              <div className="border-t dark:border-slate-700 pt-3">
                <button type="button" onClick={getBudgetSuggestion} disabled={isSuggesting} className="w-full py-2 bg-indigo-50 dark:bg-slate-900 text-primary dark:text-indigo-400 font-bold text-xs rounded-xl flex items-center justify-center gap-1">
                  {isSuggesting ? <div className="spinner border-primary"></div> : <><span className="material-symbols-outlined text-[16px]">auto_awesome</span> Get AI Suggestion</>}
                </button>
                {aiBudgetSuggest && <p className="text-[11px] text-slate-500 mt-2 text-center bg-slate-50 dark:bg-slate-900 p-2 rounded-lg">{aiBudgetSuggest}</p>}
              </div>
            </div>
          </div>
        )}

        {/* MODAL: PRICE CONFIRM */}
        {priceItem && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setPriceItem(null)}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <div>
                <span className="text-[10px] font-extrabold text-secondary uppercase">Bought!</span>
                <h3 className="font-bold text-base">{priceItem.name}</h3>
              </div>
              <form onSubmit={onConfirmPrice} className="space-y-3">
                <input type="number" autoFocus value={tempPrice} onChange={e => setTempPrice(e.target.value)} placeholder="0" className="w-full bg-slate-50 dark:bg-slate-900 border-2 border-primary rounded-xl px-3 py-2 text-xl font-bold outline-none" />
                <button type="submit" className="w-full bg-primary text-white font-bold py-2 rounded-xl text-sm">✓ Confirm</button>
              </form>
            </div>
          </div>
        )}

        {/* MODAL: HISTORY DETAILS (WITH EDIT PRICE) */}
        {selectedHist && (
          <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setSelectedHist(null)}>
            <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
              <div className="flex justify-between border-b dark:border-slate-700 pb-3">
                <div>
                  <h3 className="font-bold text-sm">{selectedHist.dateStr}</h3>
                  <p className="text-xs text-slate-400">Total: ৳{Number(selectedHist.totalSpent).toLocaleString()}</p>
                </div>
                <button onClick={() => setSelectedHist(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700">×</button>
              </div>
              <div className="space-y-2 max-h-64 overflow-y-auto no-scrollbar">
                {(selectedHist.items || []).map((it, idx) => (
                  <div key={idx} className="flex items-center justify-between text-xs py-1.5 border-b border-slate-50 dark:border-slate-800">
                    <span>{it.bought ? '✅' : '⬜'} {it.name} ({it.quantity})</span>
                    <div className="flex items-center gap-2">
                      <span className="font-bold">৳{Number(it.price || 0).toLocaleString()}</span>
                      {editHistItem?.id === it.id ? (
                        <form onSubmit={handleEditHistSubmit} className="flex items-center gap-1">
                          <input type="number" autoFocus value={editHistPrice} onChange={e => setEditHistPrice(e.target.value)} className="w-12 border rounded px-1 text-[10px]" />
                          <button type="submit" className="text-emerald-500 font-bold text-[10px]">OK</button>
                        </form>
                      ) : (
                        <button onClick={() => { setEditHistItem(it); setEditHistPrice(String(it.price)); }} className="text-primary text-[10px]">✏️ Edit</button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
