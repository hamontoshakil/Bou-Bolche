const playSound=()=>{try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();const o1=c.createOscillator(),g1=c.createGain();o1.type='sine';o1.frequency.setValueAtTime(659.25,c.currentTime);g1.gain.setValueAtTime(0.18,c.currentTime);g1.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.25);o1.connect(g1);g1.connect(c.destination);o1.start();o1.stop(c.currentTime+0.25);const o2=c.createOscillator(),g2=c.createGain();o2.type='sine';o2.frequency.setValueAtTime(880,c.currentTime+0.14);g2.gain.setValueAtTime(0.22,c.currentTime+0.14);g2.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.55);o2.connect(g2);g2.connect(c.destination);o2.start(c.currentTime+0.14);o2.stop(c.currentTime+0.55);}catch(e){}};
const prevMonthKey=(k)=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-2,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;};

function App(){
  const [isSynced, setIsSynced] = useState(false);
  const [syncError, setSyncError] = useState('');
  
  const [data,setData]=useState(DEMO);
  const [familyCode,setFamilyCode]=useState(localStorage.getItem('bb_family_code') || '');
  const [myName,setMyName]=useState(localStorage.getItem('bb_my_name') || '');
  const [joinCodeInput,setJoinCodeInput]=useState('');
  const [joinNameInput,setJoinNameInput]=useState('');
  
  const [tab,setTab]=useState('today');
  const [dark,setDark]=useState(false);
  const [lang,setLang]=useState('bn');
  const [sound,setSound]=useState(true);
  const [toast,setToast]=useState('');
  
  const [showAdd,setShowAdd]=useState(false);
  const [priceItem,setPriceItem]=useState(null);
  const [tempPrice,setTempPrice]=useState('');
  const [menuOpen,setMenuOpen]=useState(null);
  const [histFilter,setHistFilter]=useState('all');
  const [selectedHist,setSelectedHist]=useState(null);
  const [reportIdx,setReportIdx]=useState(5);
  const [showBudget,setShowBudget]=useState(false);
  const [tempBudget,setTempBudget]=useState('15000');
  const [showShare,setShowShare]=useState(false);
  const [loanFilter,setLoanFilter]=useState('all');
  const [showAddLoan,setShowAddLoan]=useState(false);
  const [loanPerson,setLoanPerson]=useState('');
  const [loanType,setLoanType]=useState('lent');
  const [loanAmount,setLoanAmount]=useState('');
  const [loanDate,setLoanDate]=useState(new Date().toISOString().split('T')[0]);
  const [loanDue,setLoanDue]=useState('');
  const [loanNote,setLoanNote]=useState('');
  const [showEditName,setShowEditName]=useState(false);
  const [editNameId,setEditNameId]=useState(null);
  const [tempName,setTempName]=useState('');
  
  // Add Item States
  const [iName,setIName]=useState('');
  const [iQty,setIQty]=useState('1 kg');
  const [iSize,setISize]=useState('');
  const [iCat,setICat]=useState('fruits');
  const [iPrice,setIPrice]=useState('');
  const [iNote,setINote]=useState('');
  const [iUrgent,setIUrgent]=useState(false);
  const [listening,setListening]=useState(false);
  const [showSuggestions,setShowSuggestions]=useState(false);

  // Quick Add States
  const [showQaMgr,setShowQaMgr]=useState(false);
  const [qaName,setQaName]=useState('');
  const [qaQty,setQaQty]=useState('1 kg');
  const [qaCat,setQaCat]=useState('grocery');
  const [qaSize,setQaSize]=useState('');
  
  // Bill States
  const [showAddBill,setShowAddBill]=useState(false);
  const [billName,setBillName]=useState('');
  const [billType,setBillType]=useState('electricity');
  const [billAmount,setBillAmount]=useState('');
  const [billDue,setBillDue]=useState('');
  const [billNote,setBillNote]=useState('');
  const [billRecurring,setBillRecurring]=useState(false);

  const t=(bn,en)=>lang==='bn'?bn:en;
  const toastFn=(m)=>{setToast(m);setTimeout(()=>setToast(''),3200);};
  const nowStr=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const getPrevPrice=(n)=>{if(!n)return null;const dict=data.priceHistory||{};const l=n.toLowerCase().trim();for(const[k,v]of Object.entries(dict))if(l.includes(k.toLowerCase()))return v;return null;};

  // Try anonymous auth optionally in background, but NEVER block Firestore sync!
  useEffect(() => {
    if(auth) {
      auth.signInAnonymously().catch(e => console.warn("Optional Auth skipped:", e.message));
    }
  }, []);

  const suggestions = useMemo(() => {
    if (!iName.trim() || iName.length < 1) return [];
    const keys = Object.keys(data.priceHistory || {});
    return keys.filter(k => k.includes(iName.toLowerCase()) || iName.includes(k)).slice(0, 4);
  }, [iName, data.priceHistory]);

  const estimatedCost = useMemo(() => {
    const unbought = (data.todayItems || []).filter(i => !i.bought);
    return unbought.reduce((sum, item) => {
      const itemPrice = item.price > 0 ? item.price : (item.lastPrice || getPrevPrice(item.name) || 0);
      return sum + itemPrice;
    }, 0);
  }, [data.todayItems, data.priceHistory]);

  // Direct Real-Time Firestore Sync (Works without waiting for Auth)
  useEffect(() => {
    if (!db || !familyCode) return;
    
    const cleanCode = familyCode.trim().toUpperCase();
    const docRef = db.collection('families').doc(cleanCode);

    const unsubscribe = docRef.onSnapshot((docSnap) => {
      setSyncError('');
      setIsSynced(true);
      if (docSnap.exists) {
        const cloudData = docSnap.data();
        setData(prev => ({ ...prev, ...cloudData }));
      } else {
        const newData = { ...DEMO, familyCode: cleanCode, members: [{id:'m1', name:myName||'Member', role:'Admin', avatar:'👤'}], updatedAt: Date.now() };
        docRef.set(newData).catch(err => {
          console.error("Write error:", err);
          setSyncError(err.code || 'permission-denied');
        });
      }
    }, (error) => {
      console.error("Firestore Listen Error:", error);
      setIsSynced(false);
      setSyncError(error.code || 'sync-error');
    });

    return () => unsubscribe();
  }, [familyCode, myName]);

  useEffect(() => {
    if (!isSynced || !myName) return;
    const exists = (data.members||[]).find(m => m.name.toLowerCase() === myName.toLowerCase());
    if (!exists) {
      const newMember = { id: 'm' + Date.now(), name: myName, role: 'Member', avatar: '👤' };
      const updated = [...(data.members||[]), newMember];
      save({ ...data, members: updated });
    }
  }, [isSynced, myName]);

  useEffect(() => {
    if (!isSynced || !data.bills || data.bills.length === 0) return;
    let changed = false;
    const today = new Date().toISOString().split('T')[0];
    
    const updatedBills = data.bills.map(b => {
      if (b.recurring && !b.paid && b.dueDate && b.dueDate < today) {
        const nextDate = new Date(b.dueDate);
        nextDate.setMonth(nextDate.getMonth() + 1);
        changed = true;
        return { ...b, dueDate: nextDate.toISOString().split('T')[0] };
      }
      return b;
    });

    if (changed) {
      save({ ...data, bills: updatedBills });
    }
  }, [isSynced, data.bills, familyCode]);

  const save=(newData)=>{
    setData(newData);
    if (!db || !familyCode) return;
    const cleanCode = familyCode.trim().toUpperCase();
    const docRef = db.collection('families').doc(cleanCode);
    docRef.set({ ...newData, updatedAt: Date.now() }, { merge: true }).catch(e=>{
        console.error("Save error:", e);
        setSyncError(e.code || 'save-error');
        toastFn("সিংক এরর! ফায়ারবেস রুলস চেক করুন");
    });
  };

  const onJoinFamily = (e) => {
    e.preventDefault();
    if(joinCodeInput.trim().length < 4) return toastFn('সঠিক কোড দিন');
    if(!joinNameInput.trim()) return toastFn('আপনার নাম লিখুন');
    
    const code = joinCodeInput.trim().toUpperCase();
    const name = joinNameInput.trim();
    
    localStorage.setItem('bb_family_code', code);
    localStorage.setItem('bb_my_name', name);
    setFamilyCode(code);
    setMyName(name);
    toastFn('কানেক্ট হচ্ছে...');
  };

  const onGenerateCode = () => {
    const nameToUse = joinNameInput.trim() || myName || 'Admin';
    const cs='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<6;i++)c+=cs.charAt(Math.floor(Math.random()*cs.length));
    localStorage.setItem('bb_family_code', c);
    localStorage.setItem('bb_my_name', nameToUse);
    setFamilyCode(c);
    setMyName(nameToUse);
    toastFn(`নতুন কোড: ${c}`);
  };

  const stats=useMemo(()=>{
    const items=data.todayItems||[];
    const bought=items.filter(i=>i.bought);
    const bazarSpent=bought.reduce((s,i)=>s+(Number(i.price)||0),0);
    
    const todayStr = new Date().toISOString().split('T')[0];
    const paidBills = (data.bills||[]).filter(b=>b.paid);
    const billsPaidToday = paidBills.filter(b=>b.paidDate === todayStr).reduce((s,b)=>s+Number(b.amount),0);
    const allPaidBillsTotal = paidBills.reduce((s,b)=>s+Number(b.amount),0);

    const spent = bazarSpent + billsPaidToday;
    
    const pastOct=(data.history||[]).filter(h=>h.monthKey==='2026-10'&&!h.isNew).reduce((s,h)=>s+(Number(h.totalSpent)||0),0);
    const monthTotal = pastOct + bazarSpent + allPaidBillsTotal;
    const budget=Number(data.monthlyBudget)||15000;
    
    return {
      total:items.length, bought:bought.length, left:items.length-bought.length,
      spent, bazarSpent, billsPaidToday,
      progress:items.length>0?Math.round((bought.length/items.length)*100):0,
      monthTotal, budget, budgetPct:Math.round((monthTotal/budget)*100)
    };
  },[data]);

  const loansStats=useMemo(()=>{
    const l=(data.loans||[]).filter(x=>!x.settled);
    const lent=l.filter(x=>x.type==='lent').reduce((s,x)=>s+Number(x.amount),0);
    const borrowed=l.filter(x=>x.type==='borrowed').reduce((s,x)=>s+Number(x.amount),0);
    return {lentTotal:lent,borrowedTotal:borrowed,net:lent-borrowed};
  },[data.loans]);

  const grouped=useMemo(()=>{
    const items=[...(data.todayItems||[])].sort((a,b)=>(a.urgent&&!b.urgent?-1:!a.urgent&&b.urgent?1:0));
    const g={};CATS.forEach(c=>{const ci=items.filter(i=>i.category===c.id);if(ci.length>0)g[c.id]={cat:c,items:ci,bought:ci.filter(i=>i.bought).length};});
    return Object.values(g);
  },[data.todayItems]);

  const reportMonth=MONTHS[reportIdx]||MONTHS[5];
  const reportData=useMemo(()=>{
    const fromToday=(data.todayItems||[]).filter(i=>i.bought);
    const isOct=reportMonth.key==='2026-10';
    const hM=(data.history||[]).filter(h=>h.monthKey===reportMonth.key&&!h.isNew);
    const hB=hM.flatMap(h=>(h.items||[]).filter(i=>i.bought));
    const its=isOct?[...fromToday,...hB]:hB;
    
    const monthBills = (data.bills||[]).filter(b => b.paid && b.paidDate && b.paidDate.startsWith(reportMonth.key));
    
    const bazarTotal=its.reduce((s,i)=>s+(Number(i.price)||0),0);
    const billsTotal = monthBills.reduce((s,b)=>s+Number(b.amount),0);
    const total = bazarTotal + billsTotal;
    
    const days=isOct?(fromToday.length>0?1:0)+hM.length:hM.length||(total>0?1:0);
    
    const catT={};
    its.forEach(it=>{const c=it.category||'other';catT[c]=(catT[c]||0)+(Number(it.price)||0);});
    monthBills.forEach(b => { const c = b.type || 'other'; catT[c] = (catT[c] || 0) + Number(b.amount); });

    const breakdown=Object.entries(catT).map(([c,a])=>{
        const obj=CATS.find(x=>x.id===c) || BILL_TYPES.find(x=>x.id===c) || CATS[0];
        return{...obj,amount:a,pct:total>0?Math.round((a/total)*100):0};
    }).sort((a,b)=>b.amount-a.amount);
    
    return {total,days,items:its.length,avg:days>0?Math.round(total/days):0,breakdown};
  },[data,reportMonth]);

  const comparison=useMemo(()=>{
    const cur=reportMonth.key,prv=prevMonthKey(cur);
    const getTot=(mk)=>{
        const tot={};
        (data.history||[]).filter(h=>h.monthKey===mk&&!h.isNew).forEach(h=>{(h.items||[]).filter(i=>i.bought).forEach(it=>{const c=it.category||'other';tot[c]=(tot[c]||0)+(Number(it.price)||0);});});
        if(mk==='2026-10'){(data.todayItems||[]).filter(i=>i.bought).forEach(it=>{const c=it.category||'other';tot[c]=(tot[c]||0)+(Number(it.price)||0);});}
        const monthBills = (data.bills||[]).filter(b => b.paid && b.paidDate && b.paidDate.startsWith(mk));
        monthBills.forEach(b => { const c = b.type || 'other'; tot[c] = (catT => (tot[c] || 0) + Number(b.amount))(); });
        return tot;
    };
    const ct=getTot(cur),pt=getTot(prv);
    const all=new Set([...Object.keys(ct),...Object.keys(pt)]);
    const rows=Array.from(all).map(id=>{
        const obj=CATS.find(c=>c.id===id) || BILL_TYPES.find(x=>x.id===id) || CATS[0];
        const c=ct[id]||0,p=pt[id]||0,ch=p>0?Math.round(((c-p)/p)*100):c>0?100:0;
        return{id,...obj,current:c,previous:p,change:ch};
    }).filter(r=>r.current>0||r.previous>0).sort((a,b)=>b.current-a.current);
    const tc=Object.values(ct).reduce((s,v)=>s+v,0),tp=Object.values(pt).reduce((s,v)=>s+v,0);
    return {rows,prevKey:prv,totalCur:tc,totalChange:tp>0?Math.round(((tc-tp)/tp)*100):0};
  },[data,reportMonth]);

  const perPerson=useMemo(()=>{
    const map={};const mk=reportMonth.key;
    (data.history||[]).filter(h=>h.monthKey===mk&&!h.isNew).forEach(h=>{(h.items||[]).filter(i=>i.bought).forEach(it=>{const n=it.addedBy||h.sender||'Unknown';if(!map[n])map[n]={name:n,total:0,count:0};map[n].total+=Number(it.price)||0;map[n].count++;});});
    if(mk==='2026-10'){(data.todayItems||[]).filter(i=>i.bought).forEach(it=>{const n=it.addedBy||'Unknown';if(!map[n])map[n]={name:n,total:0,count:0};map[n].total+=Number(it.price)||0;map[n].count++;});}
    return Object.values(map).sort((a,b)=>b.total-a.total);
  },[data,reportMonth]);

  const prevPrice=useMemo(()=>getPrevPrice(iName),[iName,data.priceHistory]);
  const filteredLoans=(data.loans||[]).filter(l=>{if(loanFilter==='lent')return l.type==='lent';if(loanFilter==='borrowed')return l.type==='borrowed';if(loanFilter==='settled')return l.settled;if(loanFilter==='active')return !l.settled;return true;});

  const syncHist=(items)=>{
    const bought=items.filter(i=>i.bought);
    const total=bought.reduce((s,i)=>s+(Number(i.price)||0),0);
    const ex=[...(data.history||[])];
    const idx=ex.findIndex(h=>h.id==='h1'||h.isNew);
    const entry={id:'h1',dateStr:'Tue, 27 Oct 2026 • Today',monthKey:'2026-10',isNew:true,boughtCount:bought.length,totalCount:items.length,totalSpent:total,sender:myName,tag:'Shopping',type:'received',items:items.map(i=>({name:i.name,quantity:i.quantity,size:i.size||'',category:i.category,price:i.price,bought:i.bought,addedBy:i.addedBy}))};
    if(idx>=0)ex[idx]=entry;else ex.unshift(entry);
    return ex;
  };

  const onToggleItem=(item)=>{
    if(!item.bought){setPriceItem(item);setTempPrice(item.price>0?String(item.price):item.lastPrice?String(item.lastPrice):'');}
    else{const u=data.todayItems.map(i=>i.id===item.id?{...i,bought:false}:i);save({...data,todayItems:u,history:syncHist(u)});}

          </div>
        )}

        {showAddLoan && (
          <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={()=>setShowAddLoan(false)}>
            <div className={`${modalBg} w-full max-w-[420px] rounded-t-[28px] sm:rounded-[28px] p-5 space-y-3.5 max-h-[90vh] overflow-y-auto`} onClick={e=>e.stopPropagation()}>
              <div className="flex items-center justify-between"><h3 className="font-extrabold text-base">{t('নতুন ধার-দেনা','Add Loan')}</h3><button onClick={()=>setShowAddLoan(false)} className="p-1.5 rounded-full bg-gray-100 dark:bg-slate-700">×</button></div>
              <form onSubmit={onAddLoan} className="space-y-3">
                <div><label className="text-xs font-bold text-gray-400 block mb-1">{t('ধরন','Type')}</label><div className="grid grid-cols-2 gap-2">
                  <button type="button" onClick={()=>setLoanType('lent')} className={`p-3 rounded-xl border flex flex-col items-center ${loanType==='lent'?'bg-green-50 dark:bg-green-950 border-[#159947] text-[#159947] dark:text-green-400':dark?'bg-slate-900 border-slate-700 text-gray-400':'bg-white border-gray-200 text-gray-700'}`}><span className="text-2xl">💚</span><span className="text-xs font-bold">{t('পাওনা','Lent')}</span></button>
                  <button type="button" onClick={()=>setLoanType('borrowed')} className={`p-3 rounded-xl border flex flex-col items-center ${loanType==='borrowed'?'bg-red-50 dark:bg-red-950 border-red-500 text-red-600 dark:text-red-400':dark?'bg-slate-900 border-slate-700 text-gray-400':'bg-white border-gray-200 text-gray-700'}`}><span className="text-2xl">💔</span><span className="text-xs font-bold">{t('দেনা','Borrowed')}</span></button>
                </div></div>
                <div><label className="text-xs font-bold text-gray-400 block mb-1">{t('নাম','Person')} *</label><input required value={loanPerson} onChange={e=>setLoanPerson(e.target.value)} placeholder={t('যেমন: Karim','e.g. Karim')} className={inputCls} /></div>
                <div><label className="text-xs font-bold text-gray-400 block mb-1">৳ *</label><input type="number" required value={loanAmount} onChange={e=>setLoanAmount(e.target.value)} className={`${inputCls} font-extrabold`} /></div>
                <div className="grid grid-cols-2 gap-2.5">
                  <div><label className="text-xs font-bold text-gray-400 block mb-1">{t('তারিখ','Date')}</label><input type="date" value={loanDate} onChange={e=>setLoanDate(e.target.value)} className={`${inputCls} text-xs`} /></div>
                  <div><label className="text-xs font-bold text-gray-400 block mb-1">{t('ফেরত','Return')}</label><input type="date" value={loanDue} onChange={e=>setLoanDue(e.target.value)} className={`${inputCls} text-xs`} /></div>
                </div>
                <div><label className="text-xs font-bold text-gray-400 block mb-1">{t('নোট','Note')}</label><input value={loanNote} onChange={e=>setLoanNote(e.target.value)} className={`${inputCls} text-xs`} /></div>
                <button type="submit" className={`w-full text-white font-bold py-3 rounded-2xl text-sm ${loanType==='lent'?'bg-[#159947]':'bg-red-500'}`}>{loanType==='lent'?`💚 ${t('পাওনা যোগ','Add Lent')}`:`💔 ${t('দেনা যোগ','Add Borrowed')}`}</button>
              </form>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
